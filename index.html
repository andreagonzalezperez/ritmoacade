<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RitmoAcade">
  <link rel="manifest" href="manifest.json">
  <title>RitmoAcade 4.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--bg:#070b16;--card:#111827;--card2:#172033;--line:#263247;--text:#eef2ff;--muted:#94a3b8;--accent:#a78bfa;--accent2:#60a5fa}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:linear-gradient(180deg,#070b16,#0b1020 55%,#070b16);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh}
    #app{min-height:100vh}
    .safe{padding-bottom:2rem}
    .navbtn{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.7rem .55rem;border:1px solid var(--line);border-radius:12px;background:rgba(17,24,39,.7);color:var(--text);font-size:.7rem;width:100%}
    .navbtn.active{background:linear-gradient(180deg,rgba(167,139,250,.16),rgba(96,165,250,.08));border-color:rgba(167,139,250,.6)}
    .btn,.pill,.card,.field,.sheet,.modal,.toast{border:1px solid var(--line)}
    .btn{padding:.7rem 1rem;border-radius:12px;background:#111827;color:var(--text);font-weight:700}
    .btn.secondary{background:transparent}
    .card{background:rgba(17,24,39,.85);border-radius:16px;padding:1rem}
    .field{background:#0f172a;color:var(--text);padding:.75rem .8rem;border-radius:10px;width:100%}
    .label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:.35rem}
    .sheet{background:rgba(9,14,26,.98);border-radius:20px 20px 0 0;padding:1rem;max-width:720px;margin:0 auto;min-height:60vh}
    .modal{position:fixed;inset:0;background:rgba(3,7,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40}
    .modal.hide,.toast.hide{display:none}
    .toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#111827;color:var(--text);padding:.8rem 1.1rem;border-radius:999px;z-index:50}
    .section-title{font-size:1.05rem;font-weight:800}
    .muted,.small{color:var(--muted)}
    .pill{display:inline-flex;align-items:center;justify-content:center;padding:.25rem .55rem;border-radius:999px;background:rgba(167,139,250,.12);color:#e9d5ff;font-size:.7rem;font-weight:700}
    .progress{height:10px;background:#1f2937;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
    .empty{padding:1rem;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;background:rgba(17,24,39,.35)}
    .checkrow{display:flex;align-items:center;gap:.6rem;margin-top:.5rem}
    .subtext{flex:1}
    .daycell{border:1px solid var(--line);border-radius:12px;padding:.4rem;min-height:78px;background:rgba(17,24,39,.6)}
    .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}
    .task-done{text-decoration:line-through;color:var(--muted)}
    @media (max-width: 700px){#app{padding:0 .6rem 2rem}} 
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="modal hide"></div>
  <div id="toast" class="toast hide"></div>
  <script>
    const KEY = "ritmoacade_pro_v4";
    const oldKey = "ritmoacade_pro_v3";
    const defaults = {
      profile:{name:"",career:"",institution:"",weeklyGoal:420},
      lists:{
        teachers:[],
        instruments:["Saxofón","Piano","Lenguaje Musical","Armonía"],
        rooms:[],
        groups:[],
        studyTypes:["Técnica","Repertorio","Lectura","Teoría","Preparación de clase","Repaso"],
        examTypes:["Parcial","Final","Recuperación","Prueba de acceso","Audición","TFM"],
        eventTypes:["Clase","Audición","Concierto","Entrega","Reunión","Otro"],
        tags:["Conservatorio","Universidad","Trabajo","Personal"],
        priorities:["Alta","Media","Baja"]
      },
      subjects:[],
      study:[],
      repertoire:[],
      tasks:[],
      exams:[],
      rehearsals:[],
      events:[],
      weekly:[],
      settings:{startWeek:1,theme:"dark"}
    };

    let db = load();
    let view = "hoy";
    let calDate = new Date();
    let timer = {running:false,seconds:0,startedAt:null,sessionType:"Estudio",instrument:""};

    function uid(p="id"){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
    function esc(s=""){return String(s).replace(/[&<>\"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
    function load(){
      try{
        const x = JSON.parse(localStorage.getItem(KEY) || "null");
        if (x) return merge(defaults, x);
        const old = JSON.parse(localStorage.getItem(oldKey) || "null");
        if (old) return merge(defaults, {subjects: old.subjects || [], tasks: old.tasks || [], rehearsals: old.rehearsals || []});
      } catch (e) {}
      return structuredClone(defaults);
    }
    function merge(a, b){
      const o = structuredClone(a);
      for (const k of Object.keys(b || {})) {
        if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && o[k]) {
          o[k] = merge(o[k], b[k]);
        } else {
          o[k] = b[k];
        }
      }
      return o;
    }
    function save(){localStorage.setItem(KEY, JSON.stringify(db));}
    function fmtDate(d){if(!d) return ""; return new Date(d + "T00:00:00").toLocaleDateString("es-ES", {day:"2-digit", month:"2-digit", year:"numeric"});}
    function currentDate(){return new Date().toISOString().slice(0,10);}
    function daysFromToday(ds){if(!ds) return null; return Math.round((new Date(ds + "T00:00:00") - new Date(currentDate() + "T00:00:00")) / 86400000);}
    function allNamed(){return [...db.subjects.map(x => x.name), ...db.repertoire.map(x => x.work), ...db.tasks.map(x => x.title)].filter(Boolean);}
    function toast(s){const t = document.querySelector("#toast"); t.textContent = s; t.classList.remove("hide"); setTimeout(() => t.classList.add("hide"), 1800);}

    function openModal(title, body, onSave, label = "Guardar"){
      document.querySelector("#modal").innerHTML = `
        <div class="sheet">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-black">${esc(title)}</h2>
            <button class="btn secondary" onclick="closeModal()">Cerrar</button>
          </div>
          <div class="grid gap-3">${body}</div>
          <div class="flex gap-2 mt-5">
            <button id="saveModal" class="btn flex-1">${label}</button>
            <button class="btn secondary" onclick="closeModal()">Cancelar</button>
          </div>
        </div>`;
      document.querySelector("#modal").classList.remove("hide");
      document.querySelector("#saveModal").onclick = () => { closeModal(); onSave(); };
    }
    function closeModal(){document.querySelector("#modal").classList.add("hide");}

    function F(label, name, type = "text", value = "", extra = ""){
      return `<div><label class="label">${label}</label><input class="field" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
    }
    function S(label, name, opts, value = "", allow = ""){
      return `<div><label class="label">${label}</label><select class="field" name="${name}">${allow ? `<option value="">${allow}</option>` : ""}${opts.map(o => `<option value="${esc(o)}" ${String(o) === String(value) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
    }
    function T(label, name, value = ""){
      return `<div><label class="label">${label}</label><textarea class="field" name="${name}" rows="2">${esc(value)}</textarea></div>`;
    }
    function val(form, n){return form.querySelector(`[name="${n}"]`)?.value || "";}
    function multiOptions(list, fallback){return [...new Set([...list, ...fallback])].filter(Boolean);}

    function addSubject(id){
      const x = id ? db.subjects.find(x => x.id === id) || {} : {};
      const body = `
        <div class="grid gap-3">
          ${F("Asignatura","name","text",x.name)}
          ${S("Profesor","teacher",db.lists.teachers,x.teacher,"Selecciona profesor")}
          ${F("Correo de contacto","email","email",x.email)}
          ${S("Aula","room",db.lists.rooms,x.room,"Selecciona aula")}
          ${S("Curso","course",["1º","2º","3º","4º","Máster","Otro"],x.course)}
          ${S("Día","day",["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],x.day)}
          <div class="grid grid-cols-2 gap-3">${F("Inicio","start","time",x.start)}${F("Final","end","time",x.end)}</div>
          ${S("¿Hay tareas para la próxima sesión?","nextTasks",["Sí","No"],x.nextTasks)}
          ${S("¿Tienes que hacer algo más?","extra",["Sí","No"],x.extra === "Sí" ? "Sí" : "No")}
          ${F("Acción adicional","extraDetail","text",x.extraDetail)}
          ${T("Notas","notes",x.notes)}
        </div>`;
      openModal(id ? "Editar asignatura" : "Nueva asignatura", body, () => {
        const f = document.querySelector("#modal form") || document.querySelector("#modal");
        const get = n => val(f, n);
        const o = {
          id: id || uid("sub"),
          name: get("name"),
          teacher: get("teacher"),
          email: get("email"),
          room: get("room"),
          course: get("course"),
          day: get("day"),
          start: get("start"),
          end: get("end"),
          nextTasks: get("nextTasks"),
          extra: get("extra"),
          extraDetail: get("extraDetail"),
          notes: get("notes")
        };
        if (id) {
          const i = db.subjects.findIndex(x => x.id === id);
          if (i >= 0) db.subjects[i] = { ...db.subjects[i], ...o };
        } else {
          db.subjects.push(o);
        }
        save(); render();
      });
      const sheet = document.querySelector(".sheet");
      const form = document.createElement("form");
      form.id = "modalForm";
      form.className = "grid gap-3";
      const content = sheet.querySelector(".grid.gap-3");
      if (content) {
        form.innerHTML = content.innerHTML;
        sheet.querySelector(".grid.gap-3").replaceWith(form);
      }
      sheet.querySelector("#saveModal").onclick = () => {
        const f = document.querySelector("#modalForm");
        const get = n => val(f, n);
        const o = {id: id || uid("sub"), name:get("name"), teacher:get("teacher"), email:get("email"), room:get("room"), course:get("course"), day:get("day"), start:get("start"), end:get("end"), nextTasks:get("nextTasks"), extra:get("extra"), extraDetail:get("extraDetail"), notes:get("notes")};
        if (id) {
          const i = db.subjects.findIndex(x => x.id === id);
          if (i >= 0) db.subjects[i] = { ...db.subjects[i], ...o };
        } else { db.subjects.push(o); }
        save(); closeModal(); render();
      };
    }

    function addStudy(id){
      const x = id ? db.study.find(x => x.id === id) || {} : {};
      const body = `
        <form id="modalForm" class="grid gap-3">
          ${S("Instrumento / asignatura","instrument",db.lists.instruments,x.instrument,"Selecciona")}
          ${S("Tipo de sesión","type",db.lists.studyTypes,x.type)}
          ${F("Objetivo","objective","text",x.objective)}
          ${F("Fecha","date","date",x.date)}
          ${F("Inicio","start","time",x.start)}
          ${F("Fin","end","time",x.end)}
          ${F("Duración (min)","duration","number",x.duration)}
        </form>`;
      openModal(id ? "Editar sesión" : "Nueva sesión", body, () => {
        const f = document.querySelector("#modalForm");
        const o = {id: id || uid("stu"), instrument: val(f,"instrument"), type: val(f,"type"), objective: val(f,"objective"), date: val(f,"date"), start: val(f,"start"), end: val(f,"end"), duration: Number(val(f,"duration") || 0)};
        if (id) {
          const i = db.study.findIndex(x => x.id === id);
          if (i >= 0) db.study[i] = { ...db.study[i], ...o };
        } else {
          db.study.push(o);
        }
        save(); render();
      });
    }

    function addRep(id){
      const x = id ? db.repertoire.find(x => x.id === id) || {} : {};
      const body = `
        <form id="modalForm" class="grid gap-3">
          ${S("Instrumento","instrument",db.lists.instruments,x.instrument)}
          ${F("Compositor","composer","text",x.composer)}
          ${F("Obra","work","text",x.work)}
          ${F("Fecha de entrega","date","date",x.date)}
          ${F("Notas","notes","text",x.notes)}
        </form>`;
      openModal(id ? "Editar repertorio" : "Nueva obra", body, () => {
        const f = document.querySelector("#modalForm");
        const o = {id: id || uid("rep"), instrument: val(f,"instrument"), composer: val(f,"composer"), work: val(f,"work"), date: val(f,"date"), notes: val(f,"notes")};
        if (id) {
          const i = db.repertoire.findIndex(x => x.id === id);
          if (i >= 0) db.repertoire[i] = { ...db.repertoire[i], ...o };
        } else { db.repertoire.push(o); }
        save(); render();
      });
    }

    function addTask(id){
      const x = id ? db.tasks.find(x => x.id === id) || {} : {};
      const body = `
        <form id="modalForm" class="grid gap-3">
          ${F("Tarea","title","text",x.title)}
          ${S("Asignatura relacionada","subject",db.subjects.map(s => s.name),x.subject,"Sin asignar")}
          ${S("Categoría","category",["Estudio","Examen","Tarea","Otro"],x.category)}
          ${F("Fecha límite","due","date",x.due)}
          ${S("Estado","status",["Pendiente","Hecha","En curso"],x.status || "Pendiente")}
          ${T("Subtareas","subtasks",(x.subtasks || []).map(s => `${s.text}${s.done ? " [done]" : ""}`).join("\n"))}
        </form>`;
      openModal(id ? "Editar tarea" : "Nueva tarea", body, () => {
        const f = document.querySelector("#modalForm");
        const o = {
          id: id || uid("tsk"),
          title: val(f,"title"),
          subject: val(f,"subject"),
          category: val(f,"category"),
          due: val(f,"due"),
          status: val(f,"status") || "Pendiente",
          subtasks: (val(f,"subtasks") || "").split("\n").filter(Boolean).map(text => ({id: uid("st"), text, done:false}))
        };
        if (id) {
          const i = db.tasks.findIndex(x => x.id === id);
          if (i >= 0) db.tasks[i] = { ...db.tasks[i], ...o };
        } else { db.tasks.push(o); }
        save(); render();
      });
    }

    function addExam(id){
      const x = id ? db.exams.find(x => x.id === id) || {} : {};
      const body = `
        <form id="modalForm" class="grid gap-3">
          ${S("Asignatura","subject",db.subjects.map(s => s.name),x.subject)}
          ${S("Tipo de examen","type",db.lists.examTypes,x.type)}
          ${F("Convocatoria","call","text",x.call)}
          ${F("Fecha","date","date",x.date)}
          ${F("Estado","status","text",x.status || "Pendiente")}
        </form>`;
      openModal(id ? "Editar examen" : "Nuevo examen", body, () => {
        const f = document.querySelector("#modalForm");
        const o = {id:id || uid("exam"), subject: val(f,"subject"), type: val(f,"type"), call: val(f,"call"), date: val(f,"date"), status: val(f,"status") || "Pendiente"};
        if (id) {
          const i = db.exams.findIndex(x => x.id === id);
          if (i >= 0) db.exams[i] = { ...db.exams[i], ...o };
        } else { db.exams.push(o); }
        save(); render();
      });
    }

    function addRehearsal(id){
      const x = id ? db.rehearsals.find(x => x.id === id) || {} : {};
      const body = `
        <form id="modalForm" class="grid gap-3">
          ${S("Agrupación","group",db.lists.groups,x.group)}
          ${S("Instrumento","instrument",db.lists.instruments,x.instrument)}
          ${S("Director","director",["Público","Privado","Otro"],x.director)}
          ${F("Fecha","date","date",x.date)}
          ${F("Inicio","start","time",x.start)}
          ${F("Fin","end","time",x.end)}
          ${F("Lugar","place","text",x.place)}
        </form>`;
      openModal(id ? "Editar ensayo" : "Nuevo ensayo", body, () => {
        const f = document.querySelector("#modalForm");
        const o = {id:id || uid("reh"), group: val(f,"group"), instrument: val(f,"instrument"), director: val(f,"director"), date: val(f,"date"), start: val(f,"start"), end: val(f,"end"), place: val(f,"place")};
        if (id) {
          const i = db.rehearsals.findIndex(x => x.id === id);
          if (i >= 0) db.rehearsals[i] = { ...db.rehearsals[i], ...o };
        } else { db.rehearsals.push(o); }
        save(); render();
      });
    }

    function addEvent(id){
      const x = id ? db.events.find(x => x.id === id) || {} : {};
      const body = `
        <form id="modalForm" class="grid gap-3">
          ${S("Tipo de evento","type",db.lists.eventTypes,x.type)}
          ${S("Lugar","place",db.lists.rooms,x.place,"Selecciona lugar")}
          ${F("Asignatura / agrupación","related","text",x.related)}
          ${F("Fecha","date","date",x.date)}
          ${F("Inicio","start","time",x.start)}
          ${F("Fin","end","time",x.end)}
          ${T("Notas","notes",x.notes)}
        </form>`;
      openModal(id ? "Editar evento" : "Nuevo evento", body, () => {
        const f = document.querySelector("#modalForm");
        const o = {id:id || uid("evt"), type: val(f,"type"), place: val(f,"place"), related: val(f,"related"), date: val(f,"date"), start: val(f,"start"), end: val(f,"end"), notes: val(f,"notes")};
        if (id) {
          const i = db.events.findIndex(x => x.id === id);
          if (i >= 0) db.events[i] = { ...db.events[i], ...o };
        } else { db.events.push(o); }
        save(); render();
      });
    }

    function addWeekly(id){
      const x = id ? db.weekly.find(x => x.id === id) || {} : {};
      const body = `
        <form id="modalForm" class="grid gap-3">
          ${S("Tipo","type",["Clase","Ensayo","Estudio","Evento"],x.type)}
          ${F("Título","title","text",x.title)}
          ${S("Día","day",["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],x.day)}
          ${F("Inicio","start","time",x.start)}
          ${F("Fin","end","time",x.end)}
          ${F("Lugar","place","text",x.place)}
          ${S("Activo","active",["Sí","No"],x.active || "Sí")}
        </form>`;
      openModal(id ? "Editar actividad semanal" : "Nueva actividad semanal", body, () => {
        const f = document.querySelector("#modalForm");
        const o = {id:id || uid("wek"), type: val(f,"type"), title: val(f,"title"), day: val(f,"day"), start: val(f,"start"), end: val(f,"end"), place: val(f,"place"), active: val(f,"active") || "Sí"};
        if (id) {
          const i = db.weekly.findIndex(x => x.id === id);
          if (i >= 0) db.weekly[i] = { ...db.weekly[i], ...o };
        } else { db.weekly.push(o); }
        save(); render();
      });
    }

    function upsert(arr, o){const i = arr.findIndex(x => x.id === o.id); if (i < 0) arr.push(o); else arr[i] = o;}
    function del(type, id){if(!confirm("¿Eliminar este elemento?")) return; db[type] = db[type].filter(x => x.id !== id); save(); render();}
    function edit(type, id){({subjects:addSubject,study:addStudy,repertoire:addRep,tasks:addTask,exams:addExam,rehearsals:addRehearsal,events:addEvent,weekly:addWeekly}[type])(id);}
    function nav(v){view = v; render();}
    function layout(content){
      return `
        <div class="safe min-h-screen">
          <header class="px-4 pt-5 pb-3 sticky top-0 z-20 bg-[#070b16]/90 backdrop-blur">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs uppercase tracking-[.2em] text-violet-300/80">RitmoAcade</div>
                <div class="text-lg font-black">4.0</div>
              </div>
              <button class="btn secondary" onclick="quickEvent()">+ Evento</button>
            </div>
            <div class="grid grid-cols-4 gap-2 mt-4">
              ${navBtn("hoy","🏠","Hoy")}
              ${navBtn("horario","📅","Horario")}
              ${navBtn("estudio","🎼","Estudio")}
              ${navBtn("repertorio","🎵","Repertorio")}
            </div>
          </header>
          <main class="px-4 pb-6">${content}</main>
        </div>`;
    }
    function navBtn(v, i, t){return `<button class="navbtn ${view === v ? "active" : ""}" onclick="nav('${v}')"><span>${i}</span>${t}</button>`;}
    function sectionHead(title, add, extra = ""){return `<div class="flex items-center justify-between mb-3 mt-6"><h2 class="section-title">${title}</h2><div class="flex gap-2">${extra}<button class="btn secondary" onclick="${add}">${typeof add === 'string' ? add.includes('(') ? '＋' : '＋' : '＋'}</button></div></div>`;}
    function eventTime(x){return [x.start, x.end].filter(Boolean).join("–");}

    function todayItems(){
      const d = currentDate();
      const a = [];
      db.subjects.filter(x => x.day && x.start && dayName(new Date(d + "T12:00:00")) === x.day).forEach(x => a.push({kind:"Clase", title:x.name, start:x.start, end:x.end, place:x.room, sub:x.id, type:"subjects"}));
      [...db.events.filter(x => x.date === d), ...db.study.filter(x => x.date === d), ...db.rehearsals.filter(x => x.date === d)].forEach(x => a.push({kind:x.type || "Actividad", title:x.title || x.objective || x.group || x.related || "Actividad", start:x.start, end:x.end, place:x.place || x.room || "", sub:x.id, type:x.type ? "event" : "study"}));
      db.weekly.filter(x => x.active !== "No" && x.day === dayName(new Date(d + "T12:00:00"))).forEach(x => a.push({kind:x.type, title:x.title, start:x.start, end:x.end, place:x.place || "", sub:x.id, type:"weekly"}));
      return a.sort((a,b) => (a.start || "99").localeCompare(b.start || "99"));
    }
    function dayName(d){return ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][d.getDay()];}
    function taskProgress(t){const s=t.subtasks||[]; if(!s.length) return t.status === "Hecha" ? 100 : 0; return Math.round(s.filter(x => x.done).length / s.length * 100);}

    function today(){
      const items = todayItems();
      const pending = db.tasks.filter(x => x.status !== "Hecha").sort((a,b) => (a.due || "99").localeCompare(b.due || "99")).slice(0,5);
      const exams = db.exams.filter(x => x.date && daysFromToday(x.date) >= 0).sort((a,b) => a.date.localeCompare(b.date)).slice(0,3);
      const due = db.tasks.filter(x => x.due === currentDate() && x.status !== "Hecha").length;
      const mins = db.study.filter(x => x.date >= weekStart() && x.date <= weekEnd()).reduce((n,x) => n + (+x.duration || 0), 0);
      return layout(`
        <div class="grid gap-3 mt-2">
          <div class="card p-4">
            <div class="text-sm muted">Hoy · ${fmtDate(currentDate())}</div>
            <div class="text-2xl font-black mt-1">${items.length ? items[0].title : "Día libre de agenda"}</div>
            <div class="small muted mt-1">${items.length ? "Agenda actualizada" : "Sin actividades programadas"}</div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div class="card p-3"><div class="text-2xl font-black">${due}</div><div class="small muted">Vencen hoy</div></div>
            <div class="card p-3"><div class="text-2xl font-black">${mins}</div><div class="small muted">Min estudio</div></div>
            <div class="card p-3"><div class="text-2xl font-black">${exams.length}</div><div class="small muted">Próx. exámenes</div></div>
          </div>
          ${sectionHead("Agenda de hoy", "quickEvent()")}
          ${items.length ? items.map(x => `<div class="card p-3 mb-2 flex justify-between"><div><div class="font-bold">${esc(x.title)}</div><div class="small muted">${esc(x.kind || x.type)} · ${eventTime(x)} ${x.place ? `· ${esc(x.place)}` : ""}</div></div><button class="btn secondary" onclick="del('${x.type === 'weekly' ? 'weekly' : 'events'}','${x.sub}')">Eliminar</button></div>`).join("") : `<div class="empty">No tienes actividades para hoy.</div>`}
          ${sectionHead("Tareas pendientes", "addTask()")}
          ${pending.length ? pending.map(t => taskCard(t)).join("") : `<div class="empty">No tienes tareas pendientes.</div>`}
          ${sectionHead("Próximos exámenes", "addExam()")}
          ${exams.length ? exams.map(e => `<div class="card p-3 mb-2"><div class="flex justify-between"><b>${esc(e.subject || "Examen")}</b><span class="pill">${daysFromToday(e.date)} días</span></div><div class="small muted">${esc(e.type)} · ${fmtDate(e.date)}</div></div>`).join("") : `<div class="empty">No hay pr��ximos exámenes.</div>`}
        </div>`);
    }

    function taskCard(t){return `<div class="card p-3 mb-2"><div class="flex justify-between gap-3"><div><b>${esc(t.title)}</b><div class="small muted">${esc(t.subject || "Sin asignatura")} · ${esc(t.category || "Tarea")}</div></div><button class="pill" onclick="finishTask('${t.id}')">${t.status === "Hecha" ? "Hecha" : "Marcar"}</button></div>${t.due ? `<div class="small muted mt-1">Vence: ${fmtDate(t.due)}</div>` : ""}</div>`;}
    function finishTask(id){const t = db.tasks.find(x => x.id === id); if(!t) return; t.status = t.status === "Hecha" ? "Pendiente" : "Hecha"; save(); render();}

    function horario(){
      const d = new Date(calDate), y=d.getFullYear(), m=d.getMonth(), first = new Date(y,m,1), days = new Date(y,m+1,0).getDate(), offset = (first.getDay()+6)%7;
      let cells = "";
      for(let i=0; i<offset; i++) cells += `<div></div>`;
      for(let n=1; n<=days; n++){
        const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
        const its = calendarItems(ds);
        cells += `<div class="daycell"><div class="text-xs font-bold">${n}</div><div class="space-y-1 mt-1">${its.map(x => `<div class="pill">${esc(x.title || x.subject || x.type || 'Evento')}</div>`).join("") || ""}</div></div>`;
      }
      const month = d.toLocaleDateString("es-ES", {month:"long", year:"numeric"});
      return layout(`
        <div class="flex items-center justify-between mt-2">
          <button class="btn secondary" onclick="calMove(-1)">‹</button>
          <h2 class="text-xl font-black capitalize">${month}</h2>
          <button class="btn secondary" onclick="calMove(1)">›</button>
        </div>
        <div class="calgrid mt-4 text-center text-xs muted">${["L","M","X","J","V","S","D"].map(x => `<div>${x}</div>`).join("")}</div>
        <div class="calgrid mt-1">${cells}</div>
        ${sectionHead("Actividades semanales", "addWeekly()")}
        ${db.weekly.length ? db.weekly.map(x => `<div class="card p-3 mb-2 flex justify-between"><div><b>${esc(x.title)}</b><div class="small muted">${esc(x.day)} · ${eventTime(x)} · ${esc(x.place || "")}</div></div><button class="pill" onclick="edit('weekly','${x.id}')">Editar</button></div>`).join("") : `<div class="empty">No hay actividades semanales.</div>`}
        ${sectionHead("Asignaturas", "addSubject()")}
        ${db.subjects.length ? db.subjects.map(x => `<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(x.name)}</b><div class="small muted">${esc(x.day || "")} · ${eventTime(x)} · ${esc(x.room || "")}</div></div><button class="pill" onclick="edit('subjects','${x.id}')">Editar</button></div></div>`).join("") : `<div class="empty">No hay asignaturas.</div>`}
      `);
    }
    function calMove(n){calDate = new Date(calDate.getFullYear(), calDate.getMonth() + n, 1); render();}
    function calendarItems(ds){return [...db.events.filter(x => x.date === ds), ...db.study.filter(x => x.date === ds), ...db.rehearsals.filter(x => x.date === ds), ...db.tasks.filter(x => x.due === ds), ...db.exams.filter(x => x.date === ds)];}

    function estudio(){
      const ws = weekStart(), we = weekEnd();
      const logs = db.study.filter(x => x.date >= ws && x.date <= we);
      const mins = logs.reduce((n,x) => n + (+x.duration || 0), 0);
      return layout(`
        ${sectionHead("Estudio","addStudy()", `<button class="btn secondary" onclick="quickStudy()">▶ Temporizador</button>`)}
        <div class="card p-4 mb-3">
          <div class="text-sm muted">Objetivo semanal</div>
          <div class="text-3xl font-black">${mins} / ${db.profile.weeklyGoal || 420} min</div>
          <div class="progress mt-3"><i style="width:${Math.min(100, mins / (db.profile.weeklyGoal || 420) * 100)}%"></i></div>
        </div>
        ${logs.length ? logs.sort((a,b) => (b.date + b.start).localeCompare(a.date + a.start)).map(x => `<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(x.instrument)} · ${esc(x.type)}</b><div class="small muted">${fmtDate(x.date)} · ${eventTime(x)}</div></div><button class="pill" onclick="edit('study','${x.id}')">Editar</button></div></div>`).join("") : `<div class="empty">No hay sesiones de estudio registradas.</div>`}
      `);
    }

    function weekStart(){const d = new Date(); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.toISOString().slice(0,10);}
    function weekEnd(){const d = new Date(weekStart() + "T12:00:00"); d.setDate(d.getDate() + 6); return d.toISOString().slice(0,10);}

    function quickStudy(){let secs = 25 * 60; timer = {running:true, seconds:secs, startedAt:Date.now(), sessionType:"Estudio", instrument: db.lists.instruments[0] || ""}; timerModal();}
    function timerModal(){
      const body = `
        <div class="text-center">
          <div id="timerClock" class="text-6xl font-black tracking-tight">25:00</div>
          <div class="muted mt-2">Temporizador de estudio</div>
          <div class="grid gap-3 mt-5">
            <div><label class="label">Instrumento</label><input class="field" name="instrument" value="${esc(timer.instrument)}"></div>
            <div><label class="label">Tipo</label><select class="field" name="type"><option value="Estudio" selected>Estudio</option><option value="Práctica">Práctica</option><option value="Repertorio">Repertorio</option></select></div>
            <div><label class="label">Duración (min)</label><input class="field" type="number" name="duration" value="25"></div>
          </div>
        </div>`;
      openModal("Sesión de estudio", body, () => saveTimer());
      const sheet = document.querySelector(".sheet");
      const saveBtn = document.querySelector("#saveModal");
      saveBtn.textContent = "Terminar y guardar";
      const clock = setInterval(() => {
        if (!document.querySelector("#timerClock")) { clearInterval(clock); return; }
        if (timer.seconds > 0) {
          timer.seconds--;
          const m = String(Math.floor(timer.seconds / 60)).padStart(2,"0");
          const s = String(timer.seconds % 60).padStart(2,"0");
          document.querySelector("#timerClock").textContent = `${m}:${s}`;
        } else {
          clearInterval(clock);
        }
      }, 1000);
    }
    function saveTimer(){
      const f = document.querySelector("#modal");
      const instrument = f.querySelector('[name="instrument"]')?.value || timer.instrument;
      const type = f.querySelector('[name="type"]')?.value || "Estudio";
      const duration = Number(f.querySelector('[name="duration"]')?.value || 25);
      db.study.push({id: uid("stu"), instrument, type, date: currentDate(), start: "", end: "", duration, objective: "Sesión de estudio"});
      save(); render();
    }

    function repertorio(){
      return layout(`${sectionHead("Repertorio","addRep()")}
        ${db.repertoire.length ? db.repertoire.map(x => `<div class="card p-3 mb-2"><div class="flex justify-between gap-3"><div><b>${esc(x.composer || "Compositor")}</b><div class="small muted">${esc(x.work || "Obra")}</div></div><button class="pill" onclick="edit('repertoire','${x.id}')">Editar</button></div></div>`).join("") : `<div class="empty">No hay obras en repertorio.</div>`}`);
    }

    function mas(){
      return layout(`<div class="grid gap-3 mt-3">${["Tareas","Exámenes","Ensayos","Eventos","Buscar","Estadísticas","Configuración"].map((x,i) => `<button class="card p-4 text-left flex justify-between items-center" onclick="${["tasksView","examsView","rehearsalsView","eventsView","searchView","statsView","settings"][i]}()"> <span>${x}</span><span>›</span></button>`).join("")}</div>`);
    }

    function genericView(title, add, items, renderItem){return layout(`${sectionHead(title, add)}${items.length ? items.map(renderItem).join("") : `<div class="empty">No hay elementos todavía.</div>`}`);}
    function tasksView(){return genericView("Tareas","addTask()",db.tasks, t => taskCard(t) + `<div class="text-right -mt-1 mb-2"><button class="pill" onclick="del('tasks','${t.id}')">Eliminar</button></div>`);}
    function examsView(){return genericView("Exámenes","addExam()",db.exams, e => `<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(e.subject)}</b><div class="small muted">${esc(e.type)} · ${fmtDate(e.date)}</div></div><button class="pill" onclick="edit('exams','${e.id}')">Editar</button></div></div>`);}
    function rehearsalsView(){return genericView("Ensayos","addRehearsal()",db.rehearsals, r => `<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(r.group)}</b><div class="small muted">${esc(r.instrument)} · ${fmtDate(r.date)} · ${eventTime(r)}</div></div><button class="pill" onclick="edit('rehearsals','${r.id}')">Editar</button></div></div>`);}
    function eventsView(){return genericView("Eventos","addEvent()",db.events, e => `<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(e.type)}</b><div class="small muted">${esc(e.place || "Sin lugar")} · ${fmtDate(e.date)} · ${eventTime(e)}</div></div><button class="pill" onclick="edit('events','${e.id}')">Editar</button></div></div>`);}
    function statsView(){const logs = db.study.filter(x => x.date >= weekStart() && x.date <= weekEnd()); const by = {}; logs.forEach(x => by[x.instrument] = (by[x.instrument] || 0) + (+x.duration || 0)); return layout(`<div class="card p-4 mt-2"><h2 class="section-title">Estadísticas</h2><div class="mt-3">${Object.entries(by).map(([k,v]) => `<div class="flex justify-between mb-2"><span>${esc(k)}</span><b>${v} min</b></div>`).join("") || "<div class=\"empty\">No hay datos todavía.</div>"}</div></div>`);}

    function settings(){
      const body = `
        <form id="modalForm" class="grid gap-3">
          <div class="font-bold">Perfil</div>
          ${F("Nombre","name","text",db.profile.name)}
          ${F("Estudios / itinerario","career","text",db.profile.career)}
          ${F("Institución","institution","text",db.profile.institution)}
          ${F("Objetivo semanal (min)","weeklyGoal","number",db.profile.weeklyGoal)}
          <div class="font-bold mt-2">Listas</div>
          ${T("Profesores","teachers",(db.lists.teachers || []).join("\n"))}
          ${T("Aulas","rooms",(db.lists.rooms || []).join("\n"))}
        </form>`;
      openModal("Configuración", body, () => {
        const f = document.querySelector("#modalForm");
        db.profile.name = val(f, "name");
        db.profile.career = val(f, "career");
        db.profile.institution = val(f, "institution");
        db.profile.weeklyGoal = Number(val(f, "weeklyGoal") || 420);
        db.lists.teachers = (val(f, "teachers") || "").split("\n").map(x => x.trim()).filter(Boolean);
        db.lists.rooms = (val(f, "rooms") || "").split("\n").map(x => x.trim()).filter(Boolean);
        save(); render();
      });
    }

    function exportData(){const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ritmoacade-backup.json"; a.click(); URL.revokeObjectURL(a.href);}
    function importData(ev){const file = ev.target.files[0]; if(!file) return; const r = new FileReader(); r.onload = () => { try { db = merge(defaults, JSON.parse(r.result)); save(); closeModal(); render(); toast("Copia importada correctamente"); } catch (e) { toast("No se pudo importar la copia"); } }; r.readAsText(file);}
    function resetData(){if(confirm("Esto borrará todos los datos locales de RitmoAcade. ¿Continuar?")){db = structuredClone(defaults); save(); closeModal(); render();}}

    function searchView(){
      const q = prompt("¿Qué quieres buscar?");
      if (q === null) return;
      const z = q.toLowerCase();
      const out = [];
      for (const [type, arr] of Object.entries(db)) {
        if (!Array.isArray(arr)) continue;
        arr.forEach(x => {
          const text = JSON.stringify(x).toLowerCase();
          if (text.includes(z)) {
            out.push({ type, title: x.title || x.name || x.work || x.subject || x.type || "Elemento", detail: x.date || x.day || x.subject || x.place || x.instrument || ""});
          }
        });
      }
      openModal("Resultados de búsqueda", out.length ? out.map(x => `<div class="card p-3 mb-2"><b>${esc(x.title)}</b><div class="small muted">${esc(x.type)} · ${esc(x.detail)}</div></div>`).join("") : `<div class="empty">No se encontraron resultados.</div>`, () => {});
    }

    function quickEvent(){addEvent();}
    function render(){
      let c = view === "hoy" ? today() : view === "horario" ? horario() : view === "estudio" ? estudio() : view === "repertorio" ? repertorio() : mas();
      document.querySelector("#app").innerHTML = c;
    }

    render();
  </script>
</body>
</html>
