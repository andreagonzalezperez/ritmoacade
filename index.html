<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RitmoAcade">
  <link rel="manifest" href="manifest.json">
  <title>RitmoAcade 5.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--bg:#070b16;--card:#111827;--card2:#172033;--line:#263247;--text:#eef2ff;--muted:#94a3b8;--accent:#a78bfa;--accent2:#60a5fa}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:linear-gradient(180deg,#070b16,#0b1020 55%,#070b16);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}#app{min-height:100vh}.safe{padding-bottom:2rem}.navbtn{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.7rem .55rem;border:1px solid var(--line);border-radius:12px;background:rgba(17,24,39,.7);color:var(--text);font-weight:700;cursor:pointer}.navbtn:hover{background:rgba(167,139,250,.2)}.navbtn.active{background:linear-gradient(180deg,rgba(167,139,250,.16),rgba(96,165,250,.08));border-color:rgba(167,139,250,.6)}.btn,.pill,.card,.field,.sheet,.modal,.toast{border:1px solid var(--line)}.btn{padding:.7rem 1rem;border-radius:12px;background:#111827;color:var(--text);font-weight:700;cursor:pointer;transition:all .2s}.btn:hover{background:#1a2238}.btn.secondary{background:transparent}.btn.secondary:hover{background:rgba(167,139,250,.1)}.card{background:rgba(17,24,39,.85);border-radius:16px;padding:1rem}.field{background:#0f172a;color:var(--text);padding:.75rem .8rem;border-radius:10px;width:100%;border:1px solid var(--line)}.field:focus{outline:none;border-color:rgba(167,139,250,.6);background:#111827}.label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:.35rem;font-weight:600}.sheet{background:rgba(9,14,26,.98);border-radius:20px 20px 0 0;padding:1rem;max-width:720px;margin:0 auto;min-height:60vh}.modal{position:fixed;inset:0;background:rgba(3,7,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40;backdrop-filter:blur(2px)}.modal.hide,.toast.hide{display:none}.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#111827;color:var(--text);padding:.8rem 1.1rem;border-radius:999px;z-index:50}.section-title{font-size:1.05rem;font-weight:800}.muted,.small{color:var(--muted)}.pill{display:inline-flex;align-items:center;justify-content:center;padding:.25rem .55rem;border-radius:999px;background:rgba(167,139,250,.12);color:#e9d5ff;font-size:.7rem;font-weight:700;cursor:pointer}.progress{height:10px;background:#1f2937;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}.empty{padding:1rem;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;background:rgba(17,24,39,.35)}.checkrow{display:flex;align-items:center;gap:.6rem;margin-top:.5rem}.subtext{flex:1}.daycell{border:1px solid var(--line);border-radius:12px;padding:.4rem;min-height:78px;background:rgba(17,24,39,.6)}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}.task-done{text-decoration:line-through;color:var(--muted)}@media (max-width:700px){#app{padding:0 .6rem 2rem}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="modal hide"></div>
  <div id="toast" class="toast hide"></div>
  <script>
    const KEY = "ritmoacade_pro_v5";
    const legacyKey = "ritmoacade_pro_v4";
    const oldKey = "ritmoacade_pro_v3";

    if (typeof structuredClone === 'undefined') {
      window.structuredClone = function(obj) {
        return JSON.parse(JSON.stringify(obj));
      };
    }

    const defaults = {
      schemaVersion: 5,
      profile:{name:"",career:"",institution:"",weeklyGoal:420},
      lists:{
        teachers:[],
        instruments:["Saxofón","Piano","Lenguaje Musical","Armonía"],
        rooms:[],
        groups:[],
        studyTypes:["Técnica","Repertorio","Lectura","Teoría","Preparación de clase","Repaso"],
        examTypes:["Parcial","Final","Recuperación","Prueba de acceso","Audición","TFM"],
        eventTypes:["Clase","Audición","Concierto","Entrega","Reunión","Otro"],
        tags:["Conservatorio","Universidad","Trabajo","Personal"],
        priorities:["Alta","Media","Baja"]
      },
      teachers:[],
      rooms:[],
      subjects:[],
      study:[],
      repertoire:[],
      tasks:[],
      exams:[],
      rehearsals:[],
      events:[],
      weekly:[],
      settings:{startWeek:1,theme:"dark"}
    };

    let db = load();
    let view = "hoy";
    let calDate = new Date();
    let timer = {running:false,seconds:0,startedAt:null,sessionType:"Estudio",instrument:""};

    function localISODate(d = new Date()) {
      const offset = d.getTimezoneOffset();
      return new Date(d.getTime() - offset * 60000).toISOString().slice(0,10);
    }

    function currentDate() {
      return localISODate();
    }

    function daysFromToday(ds) {
      if(!ds) return null;
      const today = new Date(currentDate() + "T00:00:00");
      const target = new Date(ds + "T00:00:00");
      return Math.round((target - today) / 86400000);
    }

    function weekStart() {
      const d = new Date();
      const day = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - day);
      return localISODate(d);
    }

    function weekEnd() {
      const d = new Date(weekStart() + "T12:00:00");
      d.setDate(d.getDate() + 6);
      return localISODate(d);
    }

    function uid(p="id") { return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }
    function esc(s="") { return String(s).replace(/[&<>\"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }
    function unique(arr) { return [...new Set(arr.filter(Boolean))]; }

    function load() {
      try {
        const v5 = JSON.parse(localStorage.getItem(KEY) || "null");
        if (v5) return normalizeData(v5);

        const v4 = JSON.parse(localStorage.getItem(legacyKey) || "null");
        if (v4) return migrateV4ToV5(v4);

        const old = JSON.parse(localStorage.getItem(oldKey) || "null");
        if (old) return migrateV4ToV5(old);
      } catch (e) {}
      return normalizeData(defaults);
    }

    function merge(a, b) {
      const o = structuredClone(a);
      for (const k of Object.keys(b || {})) {
        if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && o[k] && typeof o[k] === "object") {
          o[k] = merge(o[k], b[k]);
        } else {
          o[k] = b[k];
        }
      }
      return o;
    }

    function normalizeData(raw) {
      const base = merge(defaults, raw || {});
      base.schemaVersion = 5;
      base.lists = base.lists || {};
      base.lists.teachers = Array.isArray(base.lists.teachers) ? base.lists.teachers : [];
      base.lists.rooms = Array.isArray(base.lists.rooms) ? base.lists.rooms : [];
      base.lists.groups = Array.isArray(base.lists.groups) ? base.lists.groups : [];

      base.teachers = Array.isArray(base.teachers) ? base.teachers.map(normalizeTeacher).filter(Boolean) : [];
      base.rooms = Array.isArray(base.rooms) ? base.rooms.map(normalizeRoom).filter(Boolean) : [];
      base.subjects = Array.isArray(base.subjects) ? base.subjects.map(normalizeSubject).filter(Boolean) : [];
      base.study = Array.isArray(base.study) ? base.study : [];
      base.repertoire = Array.isArray(base.repertoire) ? base.repertoire : [];
      base.tasks = Array.isArray(base.tasks) ? base.tasks : [];
      base.exams = Array.isArray(base.exams) ? base.exams : [];
      base.rehearsals = Array.isArray(base.rehearsals) ? base.rehearsals : [];
      base.events = Array.isArray(base.events) ? base.events : [];
      base.weekly = Array.isArray(base.weekly) ? base.weekly : [];

      const teacherNames = unique([...base.teachers.map(t => t.name), ...base.lists.teachers]);
      base.lists.teachers = teacherNames;

      const roomNames = unique([...base.rooms.map(r => r.name), ...base.lists.rooms]);
      base.lists.rooms = roomNames;

      base.subjects.forEach(s => {
        if (!s.teacherId && s.teacher) {
          const teacher = ensureTeacherFromName(s.teacher);
          s.teacherId = teacher.id;
          s.teacher = teacher.name;
        }
        if (!s.roomId && s.room) {
          const room = ensureRoomFromName(s.room);
          s.roomId = room.id;
          s.room = room.name;
        }
      });

      return base;
    }

    function normalizeTeacher(t) {
      if (!t || typeof t !== 'object') return null;
      return {
        id: t.id || uid('tea'),
        name: String(t.name || '').trim(),
        email: t.email || '',
        phone: t.phone || '',
        roomId: t.roomId || '',
        horario: t.horario || '',
        observaciones: t.observaciones || '',
        asignaturas: Array.isArray(t.asignaturas) ? t.asignaturas : [],
        createdAt: t.createdAt || new Date().toISOString()
      };
    }

    function normalizeRoom(r) {
      if (!r || typeof r !== 'object') return null;
      return {
        id: r.id || uid('room'),
        name: String(r.name || r.numero || '').trim(),
        edificio: r.edificio || '',
        planta: r.planta || '',
        observaciones: r.observaciones || '',
        createdAt: r.createdAt || new Date().toISOString()
      };
    }

    function normalizeSubject(s) {
      if (!s || typeof s !== 'object') return null;
      const teacher = s.teacherId || s.teacher || '';
      const room = s.roomId || s.room || '';
      return {
        id: s.id || uid('sub'),
        name: String(s.name || '').trim(),
        teacher: s.teacher || '',
        teacherId: s.teacherId || '',
        email: s.email || '',
        room: s.room || '',
        roomId: s.roomId || '',
        course: s.course || '',
        group: s.group || '',
        day: s.day || '',
        start: s.start || '',
        end: s.end || '',
        nextTasks: s.nextTasks || '',
        extra: s.extra || '',
        extraDetail: s.extraDetail || '',
        color: s.color || '#a78bfa',
        objectives: s.objectives || '',
        material: s.material || '',
        startDate: s.startDate || '',
        endDate: s.endDate || '',
        credits: s.credits || '',
        notes: s.notes || '',
        teacherRef: teacher,
        roomRef: room,
        createdAt: s.createdAt || new Date().toISOString()
      };
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(normalizeData(db)));
    }

    function migrateV4ToV5(raw) {
      const source = raw && typeof raw === 'object' ? raw : {};
      const migrated = merge(defaults, source);
      migrated.schemaVersion = 5;
      migrated.teachers = [];
      migrated.rooms = [];
      migrated.lists = migrated.lists || {};
      migrated.lists.teachers = unique((source.lists && source.lists.teachers) ? source.lists.teachers : []);
      migrated.lists.rooms = unique((source.lists && source.lists.rooms) ? source.lists.rooms : []);
      migrated.lists.groups = unique((source.lists && source.lists.groups) ? source.lists.groups : []);

      const teacherNames = unique([...(source.subjects || []).map(s => s.teacher).filter(Boolean), ...(migrated.lists.teachers || [])]);
      teacherNames.forEach((name, index) => {
        const maybe = migrated.teachers.find(t => t.name === name);
        if (!maybe) {
          migrated.teachers.push({
            id: uid('tea'),
            name: String(name).trim(),
            email: '',
            phone: '',
            roomId: '',
            horario: '',
            observaciones: '',
            asignaturas: [],
            createdAt: new Date().toISOString()
          });
        }
      });

      const roomNames = unique([...(source.subjects || []).map(s => s.room).filter(Boolean), ...(migrated.lists.rooms || [])]);
      roomNames.forEach((name) => {
        const maybe = migrated.rooms.find(r => r.name === name);
        if (!maybe) {
          migrated.rooms.push({
            id: uid('room'),
            name: String(name).trim(),
            edificio: '',
            planta: '',
            observaciones: '',
            createdAt: new Date().toISOString()
          });
        }
      });

      migrated.subjects = (source.subjects || []).map((subject, idx) => {
        const teacherName = subject.teacher || '';
        const roomName = subject.room || '';
        const teacher = migrated.teachers.find(t => t.name === teacherName) || (teacherName ? { id: uid('tea'), name: teacherName, email:'', phone:'', roomId:'', horario:'', observaciones:'', asignaturas:[], createdAt:new Date().toISOString() } : null);
        const room = migrated.rooms.find(r => r.name === roomName) || (roomName ? { id: uid('room'), name: roomName, edificio:'', planta:'', observaciones:'', createdAt:new Date().toISOString() } : null);

        if (teacher && !migrated.teachers.some(t => t.id === teacher.id)) migrated.teachers.push(teacher);
        if (room && !migrated.rooms.some(r => r.id === room.id)) migrated.rooms.push(room);

        return {
          id: subject.id || uid('sub'),
          name: subject.name || `Asignatura ${idx + 1}`,
          teacher: teacherName,
          teacherId: teacher ? teacher.id : '',
          email: subject.email || '',
          room: roomName,
          roomId: room ? room.id : '',
          course: subject.course || '',
          group: subject.group || '',
          day: subject.day || '',
          start: subject.start || '',
          end: subject.end || '',
          nextTasks: subject.nextTasks || '',
          extra: subject.extra || '',
          extraDetail: subject.extraDetail || '',
          color: subject.color || '#a78bfa',
          objectives: subject.objectives || '',
          material: subject.material || '',
          startDate: subject.startDate || '',
          endDate: subject.endDate || '',
          credits: subject.credits || '',
          notes: subject.notes || '',
          teacherRef: teacherName,
          roomRef: roomName,
          createdAt: new Date().toISOString()
        };
      });

      migrated.subjects.forEach(subject => {
        if (subject.teacherId) {
          const teacher = migrated.teachers.find(t => t.id === subject.teacherId);
          if (teacher && !teacher.asignaturas.includes(subject.id)) teacher.asignaturas.push(subject.id);
        }
        if (subject.roomId) {
          const room = migrated.rooms.find(r => r.id === subject.roomId);
          if (room && !room.asignaturas) room.asignaturas = [];
          if (room && !room.asignaturas.includes(subject.id)) room.asignaturas.push(subject.id);
        }
      });

      return normalizeData(migrated);
    }

    function ensureTeacherFromName(name) {
      const clean = String(name || '').trim();
      if (!clean) return null;
      let teacher = db.teachers.find(t => t.name === clean);
      if (!teacher) {
        teacher = { id: uid('tea'), name: clean, email:'', phone:'', roomId:'', horario:'', observaciones:'', asignaturas:[] };
        db.teachers.push(teacher);
      }
      if (!db.lists.teachers.includes(clean)) db.lists.teachers.push(clean);
      return teacher;
    }

    function ensureRoomFromName(name) {
      const clean = String(name || '').trim();
      if (!clean) return null;
      let room = db.rooms.find(r => r.name === clean);
      if (!room) {
        room = { id: uid('room'), name: clean, edificio:'', planta:'', observaciones:'' };
        db.rooms.push(room);
      }
      if (!db.lists.rooms.includes(clean)) db.lists.rooms.push(clean);
      return room;
    }

    function teacherById(id) { return db.teachers.find(t => t.id === id) || null; }
    function roomById(id) { return db.rooms.find(r => r.id === id) || null; }

    function teacherNameForSubject(subject) {
      if (!subject) return "";
      if (subject.teacherId) {
        const teacher = teacherById(subject.teacherId);
        if (teacher) return teacher.name;
      }
      if (subject.teacher) return subject.teacher;
      return "";
    }

    function roomNameForSubject(subject) {
      if (!subject) return "";
      if (subject.roomId) {
        const room = roomById(subject.roomId);
        if (room) return room.name;
      }
      if (subject.room) return subject.room;
      return "";
    }

    function subjectDisplayLabel(s) {
      const teacher = teacherNameForSubject(s);
      const room = roomNameForSubject(s);
      const meta = [teacher || "Sin profesor", room || "Sin aula"].filter(Boolean);
      return meta.join(" · ");
    }

    function fmtDate(d) { if (!d) return ""; return new Date(d + "T00:00:00").toLocaleDateString("es-ES", {day:"2-digit", month:"2-digit", year:"numeric"}); }
    function allNamed(){ return [...db.subjects.map(x => x.name), ...db.repertoire.map(x => x.work), ...db.tasks.map(x => x.title)].filter(Boolean); }
    function toast(s) { const t = document.querySelector("#toast"); t.textContent = s; t.classList.remove("hide"); setTimeout(() => t.classList.add("hide"), 1800); }

    function openModal(title, body, onSave, label = "Guardar") {
      document.querySelector("#modal").innerHTML = `
        <div class="sheet">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-black">${esc(title)}</h2>
            <button class="btn secondary" onclick="closeModal()">Cerrar</button>
          </div>
          <div class="grid gap-3">${body}</div>
          <div class="flex gap-2 mt-5">
            <button id="saveModal" class="btn flex-1">${label}</button>
            <button class="btn secondary" onclick="closeModal()">Cancelar</button>
          </div>
        </div>`;
      document.querySelector("#modal").classList.remove("hide");
      document.querySelector("#saveModal").onclick = () => { onSave(); closeModal(); };
    }

    function closeModal() { document.querySelector("#modal").classList.add("hide"); }

    function F(label, name, type = "text", value = "", extra = "") {
      return `<div><label class="label">${label}</label><input class="field" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
    }

    function S(label, name, opts, value = "", allow = "") {
      const list = Array.isArray(opts) ? opts : [];
      const val = String(value || "");
      return `<div><label class="label">${label}</label><select class="field" name="${name}">${allow ? `<option value="">${allow}</option>` : ""}${list.map(o => `<option value="${esc(o.value || o)}" ${val === (o.value || o) ? "selected" : ""}>${esc(o.label || o)}</option>`).join("")}</select></div>`;
    }

    function T(label, name, value = "") {
      return `<div><label class="label">${label}</label><textarea class="field" name="${name}" rows="2">${esc(value)}</textarea></div>`;
    }

    function val(form, n) { return form.querySelector(`[name="${n}"]`)?.value || ""; }
    function multiOptions(list, fallback) { return [...new Set([...list, ...fallback])].filter(Boolean); }

    function addTeacher(id) {
      const x = id ? db.teachers.find(x => x.id === id) || {} : {};
      const body = `
        <div class="grid gap-3">
          ${F("Nombre","name","text",x.name)}
          ${F("Correo electrónico","email","email",x.email)}
          ${F("Teléfono","phone","tel",x.phone)}
          ${S("Aula habitual","roomId", db.rooms.map(r => ({label: r.name, value: r.id})), x.roomId || "", "Selecciona aula")}
          ${F("Horario","horario","text",x.horario)}
          ${T("Observaciones","observaciones",x.observaciones)}
          ${T("Asignaturas relacionadas","asignaturas", Array.isArray(x.asignaturas) ? x.asignaturas.join("\n") : "")}
        </div>`;

      openModal(id ? "Editar profesor" : "Nuevo profesor", body, () => {
        const f = document.querySelector("#modal");
        const teacher = {
          id: id || uid("tea"),
          name: val(f, "name").trim(),
          email: val(f, "email").trim(),
          phone: val(f, "phone").trim(),
          roomId: val(f, "roomId"),
          horario: val(f, "horario").trim(),
          observaciones: val(f, "observaciones").trim(),
          asignaturas: (val(f, "asignaturas") || "").split("\n").map(x => x.trim()).filter(Boolean),
          createdAt: x.createdAt || new Date().toISOString()
        };
        const i = db.teachers.findIndex(x => x.id === teacher.id);
        if (i >= 0) db.teachers[i] = { ...db.teachers[i], ...teacher }; else db.teachers.push(teacher);
        db.lists.teachers = unique([...db.teachers.map(t => t.name), ...db.lists.teachers]);
        save(); render();
      });
    }

    function addRoom(id) {
      const x = id ? db.rooms.find(x => x.id === id) || {} : {};
      const body = `
        <div class="grid gap-3">
          ${F("Nombre / número","name","text",x.name)}
          ${F("Edificio","edificio","text",x.edificio)}
          ${F("Planta","planta","text",x.planta)}
          ${T("Observaciones","observaciones",x.observaciones)}
        </div>`;

      openModal(id ? "Editar aula" : "Nueva aula", body, () => {
        const f = document.querySelector("#modal");
        const room = {
          id: id || uid("room"),
          name: val(f, "name").trim(),
          edificio: val(f, "edificio").trim(),
          planta: val(f, "planta").trim(),
          observaciones: val(f, "observaciones").trim(),
          createdAt: x.createdAt || new Date().toISOString()
        };
        const i = db.rooms.findIndex(x => x.id === room.id);
        if (i >= 0) db.rooms[i] = { ...db.rooms[i], ...room }; else db.rooms.push(room);
        db.lists.rooms = unique([...db.rooms.map(r => r.name), ...db.lists.rooms]);
        save(); render();
      });
    }

    function addSubject(id) {
      const x = id ? db.subjects.find(x => x.id === id) || {} : {};
      const teacherOptions = db.teachers.map(t => ({label: t.name, value: t.id}));
      const roomOptions = db.rooms.map(r => ({label: r.name, value: r.id}));
      const groupOptions = unique([...db.lists.groups, "A", "B", "C", "D", "E", "F"]).map(g => ({label: g, value: g}));
      const courseOptions = ["1º","2º","3º","4º","Máster","Otro"].map(v => ({label: v, value: v}));
      const body = `
        <div class="grid gap-3">
          ${F("Asignatura","name","text",x.name)}
          ${S("Profesor","teacherId", teacherOptions, x.teacherId || (x.teacher ? db.teachers.find(t => t.name === x.teacher)?.id || "" : ""), "Selecciona profesor")}
          ${S("Aula","roomId", roomOptions, x.roomId || (x.room ? db.rooms.find(r => r.name === x.room)?.id || "" : ""), "Selecciona aula")}
          ${S("Curso","course", courseOptions, x.course, "Selecciona curso")}
          ${S("Grupo","group", groupOptions, x.group, "Selecciona grupo")}
          ${S("Día","day", ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"].map(d => ({label: d, value: d})), x.day, "Selecciona día")}
          <div class="grid grid-cols-2 gap-3">${F("Inicio","start","time",x.start)}${F("Final","end","time",x.end)}</div>
          ${F("Color","color","color",x.color || "#a78bfa")}
          ${T("Objetivos","objectives",x.objectives)}

    function horario(){
      const d = new Date(calDate), y = d.getFullYear(), m = d.getMonth(), first = new Date(y,m,1), days = new Date(y,m+1,0).getDate(), offset = (first.getDay()+6)%7;
      let cells = "";
      for(let i=0; i<offset; i++) cells += `<div></div>`;
      for(let n=1; n<=days; n++){

        cells += `<div class="daycell"><div class="text-xs font-bold">${n}</div><div class="space-y-1 mt-1">${its.map(x => `<div class="pill text-xs">${esc(x.title || x.subject || x.type || 'Evento')}</div>`).join("")}</div></div>`;

    function timerModal(){
      const body = `
        <div class="text-center">
          <div id="timerClock" class="text-6xl font-black tracking-tight">25:00</div>
          <div class="muted mt-2">Temporizador de estudio</div>
          <div class="grid gap-3 mt-5">
            <div><label class="label">Instrumento</label><input class="field" name="instrument" value="${esc(timer.instrument)}"></div>
            <div><label class="label">Tipo</label><select class="field" name="type"><option value="Estudio" selected>Estudio</option><option value="Práctica">Práctica</option><option value="Repaso">Repaso</option><option value="Otro">Otro</option></select></div>
            <div><label class="label">Duración (min)</label><input class="field" type="number" name="duration" value="25"></div>
          </div>
        </div>`;
      openModal("Sesión de estudio", body, () => saveTimer());
      const sheet = document.querySelector(".sheet");
      const saveBtn = document.querySelector("#saveModal");
      saveBtn.textContent = "Terminar y guardar";
      const clock = setInterval(() => {
        if (!document.querySelector("#timerClock")) { clearInterval(clock); return; }
        if (timer.seconds > 0) {
          timer.seconds--;
          const m = String(Math.floor(timer.seconds / 60)).padStart(2,"0");
          const s = String(timer.seconds % 60).padStart(2,"0");
          document.querySelector("#timerClock").textContent = `${m}:${s}`;
        } else {
          clearInterval(clock);
        }
      }, 1000);
    }

    function saveTimer(){
      const f = document.querySelector("#modal");
      const instrument = f.querySelector('[name="instrument"]')?.value || timer.instrument;
      const type = f.querySelector('[name="type"]')?.value || "Estudio";
      const duration = Number(f.querySelector('[name="duration"]')?.value || 25);
      db.study.push({id: uid("stu"), instrument, type, date: currentDate(), start: "", end: "", duration, objective: "Sesión de estudio"});
      save(); render();
    }

    function repertorio(){
      return layout(`${sectionHead("Repertorio","addRep()")}
        ${db.repertoire.length ? db.repertoire.map(x => `<div class="card p-3 mb-2"><div class="flex justify-between gap-3"><div><b>${esc(x.composer || "Compositor")} — ${esc(x.work || "Obra")}</b><div class="small muted">${esc(x.instrument || "Sin instrumento")} · ${fmtDate(x.date)}</div></div><div class="flex gap-2"><button class="pill" onclick="edit('repertoire','${x.id}')">Editar</button><button class="pill" onclick="del('repertoire','${x.id}')">Eliminar</button></div></div></div>`).join("") : `<div class="empty">No hay repertorio todavía.</div>`}
      `);
    }

    function mas(){
      return layout(`<div class="grid gap-3 mt-3">
        ${["Tareas","Exámenes","Ensayos","Eventos","Buscar","Estadísticas","Configuración"].map((x,i) => `<button class="card p-4 text-left flex justify-between items-center" onclick="${["tasksView()","examsView()","rehearsalsView()","eventsView()","searchView()","statsView()","settings()",""][i]}">${x}<span>›</span></button>`).join("")}
      </div>`);
    }

    function genericView(title, add, items, renderItem){return layout(`${sectionHead(title, add)}${items.length ? items.map(renderItem).join("") : `<div class="empty">No hay elementos todavía.</div>`}`);}
    function tasksView(){return genericView("Tareas", "addTask()", db.tasks, t => taskCard(t) + `<div class="text-right -mt-1 mb-2"><button class="pill" onclick="del('tasks','${t.id}')">Eliminar</button></div>`);}
    function examsView(){return genericView("Exámenes", "addExam()", db.exams, e => `<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(e.subject)}</b><div class="small muted">${esc(e.type || "Examen")} · ${fmtDate(e.date)}</div></div><div class="flex gap-2"><button class="pill" onclick="edit('exams','${e.id}')">Editar</button><button class="pill" onclick="del('exams','${e.id}')">Eliminar</button></div></div></div>`);}
    function rehearsalsView(){return genericView("Ensayos", "addRehearsal()", db.rehearsals, r => `<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(r.group)}</b><div class="small muted">${esc(r.instrument)} · ${fmtDate(r.date)} · ${esc(r.place || "Sin lugar")}</div></div><div class="flex gap-2"><button class="pill" onclick="edit('rehearsals','${r.id}')">Editar</button><button class="pill" onclick="del('rehearsals','${r.id}')">Eliminar</button></div></div></div>`);}
    function eventsView(){return genericView("Eventos", "addEvent()", db.events, e => `<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(e.type)}</b><div class="small muted">${esc(e.related || "Sin relación")} · ${fmtDate(e.date)} · ${eventTime(e)}</div></div><div class="flex gap-2"><button class="pill" onclick="edit('events','${e.id}')">Editar</button><button class="pill" onclick="del('events','${e.id}')">Eliminar</button></div></div></div>`);}

    function statsView(){
      const logs = db.study.filter(x => x.date >= weekStart() && x.date <= weekEnd());
      const by = {};
      logs.forEach(x => by[x.instrument] = (by[x.instrument] || 0) + (+x.duration || 0));
      return layout(`<h2 class="section-title mt-6">Estadísticas de estudio</h2><div class="grid gap-3 mt-4">${Object.entries(by).map(([inst, mins]) => `<div class="card p-3"><div class="flex justify-between"><div>${esc(inst)}</div><b>${mins} min</b></div></div>`).join("") || `<div class="empty">Todavía no hay datos esta semana.</div>`}</div>`);
    }

    function settings(){
      const body = `
        <div class="grid gap-3">
          <div class="font-bold">Perfil</div>
          ${F("Nombre","name","text",db.profile.name)}
          ${F("Estudios / itinerario","career","text",db.profile.career)}
          ${F("Institución","institution","text",db.profile.institution)}
          ${F("Objetivo semanal (min)","weeklyGoal","number",db.profile.weeklyGoal)}
          <div class="font-bold mt-2">Profesores</div>
          <div class="grid grid-cols-2 gap-2">
            <button class="btn secondary" onclick="addTeacher()">+ Añadir profesor</button>
            <button class="btn secondary" onclick="renderTeacherList()">Ver profesores</button>
          </div>
          <div class="font-bold mt-2">Aulas</div>
          <div class="grid grid-cols-2 gap-2">
            <button class="btn secondary" onclick="addRoom()">+ Añadir aula</button>
            <button class="btn secondary" onclick="renderRoomList()">Ver aulas</button>
          </div>
          <div class="font-bold mt-2">Datos</div>
          <div class="grid grid-cols-2 gap-2">
            <button class="btn secondary" onclick="exportData()">⬇ Exportar</button>
            <button class="btn secondary" onclick="document.querySelector('#importFile').click()">⬆ Importar</button>
            <input id="importFile" type="file" accept=".json" onchange="importData(event)" style="display:none">
            <button class="btn secondary" onclick="resetData()" style="grid-column:1/-1">🗑 Borrar datos</button>
          </div>
        </div>`;
      openModal("Configuración", body, () => {
        const f = document.querySelector("#modal");
        db.profile.name = val(f, "name");
        db.profile.career = val(f, "career");
        db.profile.institution = val(f, "institution");
        db.profile.weeklyGoal = Number(val(f, "weeklyGoal") || 420);
        save(); render();
      });
    }

    function renderTeacherList() {
      const list = db.teachers.length ? db.teachers.map(t => `
        <div class="card p-3 mb-2">
          <div class="flex justify-between gap-3">
            <div><b>${esc(t.name || "Profesor sin nombre")}</b><div class="small muted">${esc(t.email || "Sin email")} · ${esc(t.phone || "Sin teléfono")}</div></div>
            <div class="flex gap-2"><button class="pill" onclick="edit('teachers','${t.id}')">Editar</button><button class="pill" onclick="del('teachers','${t.id}')">Eliminar</button></div>
          </div>
        </div>`).join("") : `<div class="empty">No hay profesores todavía.</div>`;
      openModal("Profesores", `<div class="grid gap-2">${list}</div>`, () => {}, "Cerrar");
      document.querySelector("#saveModal").remove();
    }

    function renderRoomList() {
      const list = db.rooms.length ? db.rooms.map(r => `
        <div class="card p-3 mb-2">
          <div class="flex justify-between gap-3">
            <div><b>${esc(r.name || "Aula sin nombre")}</b><div class="small muted">${esc(r.edificio || "Sin edificio")} · ${esc(r.planta || "Sin planta")}</div></div>
            <div class="flex gap-2"><button class="pill" onclick="edit('rooms','${r.id}')">Editar</button><button class="pill" onclick="del('rooms','${r.id}')">Eliminar</button></div>
          </div>
        </div>`).join("") : `<div class="empty">No hay aulas todavía.</div>`;
      openModal("Aulas", `<div class="grid gap-2">${list}</div>`, () => {}, "Cerrar");
      document.querySelector("#saveModal").remove();
    }

    function exportData(){
      const blob = new Blob([JSON.stringify(normalizeData(db), null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ritmoacade-backup-" + currentDate() + ".json";
      a.click();
    }

    function importData(ev){
      const file = ev.target.files[0];
      if(!file) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          db = normalizeData(JSON.parse(r.result));
          save();
          closeModal();
          render();
          toast("Copia de seguridad restaurada");
        } catch(e) {
          toast("Error al importar: " + e.message);
        }
      };
      r.readAsText(file);
    }

    function resetData(){
      if(confirm("Esto borrará todos los datos locales de RitmoAcade. ¿Continuar?")){
        db = normalizeData(defaults);
        save();
        closeModal();
        render();
        toast("Datos borrados");
      }
    }

    function searchView(){
      const q = prompt("¿Qué quieres buscar?");
      if (q === null) return;
      const z = q.toLowerCase();
      const out = [];
      for (const [type, arr] of Object.entries(db)) {
        if (!Array.isArray(arr)) continue;
        arr.forEach(x => {
          const text = JSON.stringify(x).toLowerCase();
          if (text.includes(z)) {
            out.push({ type, title: x.title || x.name || x.work || x.subject || x.type || "Elemento", detail: x.date || x.day || x.subject || x.place || x.instrument || ""});
          }
        });
      }
      openModal("Resultados de búsqueda", out.length ? out.map(x => `<div class="card p-3 mb-2"><b>${esc(x.title)}</b><div class="small muted">${esc(x.type)} · ${esc(x.detail)}</div></div>`).join("") : `<div class="empty">No hay resultados.</div>`, () => {}, "Cerrar");
      document.querySelector("#saveModal").remove();
    }

    function quickEvent(){addEvent();}

    function render(){
      let c = view === "hoy" ? today() : view === "horario" ? horario() : view === "estudio" ? estudio() : view === "repertorio" ? repertorio() : mas();
      document.querySelector("#app").innerHTML = c;
    }

    render();
  </script>
</body>
</html>
