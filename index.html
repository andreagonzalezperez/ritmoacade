<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RitmoAcade">
<link rel="manifest" href="manifest.json">
<title>RitmoAcade 5.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#070b16;--card:#111827;--card2:#172033;--line:#263247;--text:#eef2ff;--muted:#94a3b8;--accent:#a78bfa;--accent2:#60a5fa}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:linear-gradient(180deg,#070b16,#0b1020 55%,#070b16);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{min-height:100vh}#app{min-height:100vh}.safe{padding-bottom:2rem}.navbtn{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.7rem .55rem;border:1px solid var(--line);border-radius:12px;background:rgba(17,24,39,.7);color:var(--text);font-size:.65rem;font-weight:600;cursor:pointer}.navbtn.active{background:linear-gradient(180deg,rgba(167,139,250,.16),rgba(96,165,250,.08));border-color:rgba(167,139,250,.6)}.btn,.pill,.card,.field,.sheet,.modal,.toast{border:1px solid var(--line)}.btn{padding:.7rem 1rem;border-radius:12px;background:#111827;color:var(--text);font-weight:700;cursor:pointer}.btn.secondary{background:transparent}.card{background:rgba(17,24,39,.85);border-radius:16px;padding:1rem}.field{background:#0f172a;color:var(--text);padding:.75rem .8rem;border-radius:10px;width:100%}.label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:.35rem}.sheet{background:rgba(9,14,26,.98);border-radius:20px 20px 0 0;padding:1rem;max-width:720px;margin:0 auto;min-height:60vh}.modal{position:fixed;inset:0;background:rgba(3,7,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40}.modal.hide,.toast.hide{display:none}.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#111827;color:var(--text);padding:.8rem 1.1rem;border-radius:999px;z-index:50}.section-title{font-size:1.05rem;font-weight:800}.muted,.small{color:var(--muted)}.pill{display:inline-flex;align-items:center;justify-content:center;padding:.25rem .55rem;border-radius:999px;background:rgba(167,139,250,.12);color:#e9d5ff;font-size:.7rem;font-weight:700}.progress{height:10px;background:#1f2937;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}.empty{padding:1rem;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;background:rgba(17,24,39,.35)}.daycell{border:1px solid var(--line);border-radius:12px;padding:.4rem;min-height:78px;background:rgba(17,24,39,.6)}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}.task-done{text-decoration:line-through;color:var(--muted)}@media (max-width:700px){#app{padding:0 .6rem 2rem}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hide"></div>
<div id="toast" class="toast hide"></div>
<script>
const KEY="ritmoacade_pro_v5";
const legacyKey="ritmoacade_pro_v4";
const oldKey="ritmoacade_pro_v3";
const defaults={
 schemaVersion:5,
 profile:{name:"",career:"",institution:"",weeklyGoal:420},
 lists:{teachers:[],instruments:["Saxofón","Piano","Lenguaje Musical","Armonía"],rooms:[],groups:[],studyTypes:["Técnica","Repertorio","Lectura","Teoría","Preparación de clase","Repaso"],examTypes:["Parcial","Final","Recuperación","Prueba de acceso","Audición","TFM"],eventTypes:["Clase","Audición","Concierto","Entrega","Reunión","Otro"],tags:["Conservatorio","Universidad","Trabajo","Personal"],priorities:["Alta","Media","Baja"]},
 teachers:[],
 rooms:[],
 subjects:[],study:[],repertoire:[],tasks:[],exams:[],rehearsals:[],events:[],weekly:[],
 settings:{startWeek:1,theme:"dark"}
};
if(typeof structuredClone==='undefined'){window.structuredClone=function(obj){return JSON.parse(JSON.stringify(obj));};}
let db=load();
let view="hoy"; let calDate=new Date(); let timer={running:false,seconds:0,startedAt:null,sessionType:"Estudio",instrument:""};
function uid(p="id"){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function esc(s=""){return String(s).replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function localISODate(d=new Date()){const offset=d.getTimezoneOffset(); return new Date(d.getTime()-offset*60000).toISOString().slice(0,10)}
function currentDate(){return localISODate()}
function fmtDate(d){if(!d)return ""; return new Date(d+"T00:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"})}
function daysFromToday(ds){if(!ds)return null; const today=new Date(currentDate()+"T00:00:00"); const target=new Date(ds+"T00:00:00"); return Math.round((target-today)/86400000)}
function weekStart(){const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return localISODate(d)}
function weekEnd(){const d=new Date(weekStart()+"T12:00:00"); d.setDate(d.getDate()+6); return localISODate(d)}
function cloneData(v){return typeof structuredClone==='function'?structuredClone(v):JSON.parse(JSON.stringify(v));}
function merge(a,b){const o=cloneData(a); for(const k of Object.keys(b||{})){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&o[k]) o[k]=merge(o[k],b[k]); else o[k]=b[k]} return o}
function normalizeTeacher(item){return {id:item.id||uid("te"),name:item.name||"",email:item.email||"",phone:item.phone||"",roomId:item.roomId||"",horario:item.horario||"",observaciones:item.observaciones||"",asignaturas:Array.isArray(item.asignaturas)?item.asignaturas:[]};}
function normalizeRoom(item){return {id:item.id||uid("room"),name:item.name||"",edificio:item.edificio||"",planta:item.planta||"",observaciones:item.observaciones||""};}
function normalizeSubject(item){return {id:item.id||uid("sub"),name:item.name||"",teacher:item.teacher||"",teacherId:item.teacherId||"",email:item.email||"",room:item.room||"",roomId:item.roomId||"",course:item.course||"",group:item.group||"",day:item.day||"",start:item.start||"",end:item.end||"",color:item.color||"#a78bfa",objectives:item.objectives||"",material:item.material||"",startDate:item.startDate||"",endDate:item.endDate||"",credits:item.credits||"",notes:item.notes||""};}
function migrateV4ToV5(raw){
 const source = raw && typeof raw === "object" ? raw : {};
 const base = merge(defaults, source);
 const result = merge(defaults, {schemaVersion:5,profile:base.profile||defaults.profile,lists:base.lists||defaults.lists,teachers:[],rooms:[]});
 result.subjects=(Array.isArray(base.subjects)?base.subjects:[]).map(normalizeSubject);
 result.study=Array.isArray(base.study)?base.study:[];
 result.repertoire=Array.isArray(base.repertoire)?base.repertoire:[];
 result.tasks=Array.isArray(base.tasks)?base.tasks:[];
 result.exams=Array.isArray(base.exams)?base.exams:[];
 result.rehearsals=Array.isArray(base.rehearsals)?base.rehearsals:[];
 result.events=Array.isArray(base.events)?base.events:[];
 result.weekly=Array.isArray(base.weekly)?base.weekly:[];
 result.lists=merge(defaults.lists,base.lists||{});
 result.lists.teachers = Array.isArray(base.lists && base.lists.teachers) ? base.lists.teachers : [];
 result.lists.rooms = Array.isArray(base.lists && base.lists.rooms) ? base.lists.rooms : [];
 result.lists.instruments = Array.isArray(base.lists && base.lists.instruments) && base.lists.instruments.length ? base.lists.instruments : defaults.lists.instruments;
 result.lists.groups = Array.isArray(base.lists && base.lists.groups) ? base.lists.groups : [];
 result.teachers = (result.lists.teachers||[]).map((name,i)=>normalizeTeacher({id:uid("te"),name:String(name),email:"",phone:"",roomId:"",horario:"",observaciones:"",asignaturas:[]}));
 result.rooms = (result.lists.rooms||[]).map((name,i)=>normalizeRoom({id:uid("room"),name:String(name),edificio:"",planta:"",observaciones:""}));
 result.subjects = result.subjects.map((s,idx)=>{
   const teacherName = s.teacher || "";
   const roomName = s.room || "";
   const matchedTeacher = result.teachers.find(t => t.name === teacherName) || null;
   const matchedRoom = result.rooms.find(r => r.name === roomName) || null;
   const normalized = normalizeSubject(s);
   normalized.teacherId = matchedTeacher ? matchedTeacher.id : "";
   normalized.teacher = matchedTeacher ? matchedTeacher.name : (teacherName || "");
   normalized.roomId = matchedRoom ? matchedRoom.id : "";
   normalized.room = matchedRoom ? matchedRoom.name : (roomName || "");
   if (matchedTeacher && !matchedTeacher.asignaturas.includes(normalized.id)) matchedTeacher.asignaturas.push(normalized.id);
   return normalized;
 });
 result.settings = merge(defaults.settings, base.settings||{});
 result.schemaVersion = 5;
 return result;
}
function load(){
 try{
  const rawV5 = JSON.parse(localStorage.getItem(KEY)||"null");
  if(rawV5 && rawV5.schemaVersion >= 5) return merge(defaults, rawV5);
  const rawV4 = JSON.parse(localStorage.getItem(legacyKey)||"null");
  if(rawV4) return migrateV4ToV5(rawV4);
  const old = JSON.parse(localStorage.getItem(oldKey)||"null");
  if(old) return migrateV4ToV5({subjects:old.subjects||[],tasks:old.tasks||[],rehearsals:old.rehearsals||[],lists:{teachers:[],rooms:[],groups:[],instruments:old.instruments||[],studyTypes:[],examTypes:[],eventTypes:[],tags:[],priorities:[]},profile:{name:"",career:"",institution:"",weeklyGoal:420}});
 }catch(e){}
 return cloneData(defaults);
}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(s){const t=document.querySelector("#toast"); t.textContent=s; t.classList.remove("hide"); setTimeout(()=>t.classList.add("hide"),1800)}
function openModal(title,body,onSave,label="Guardar"){document.querySelector("#modal").innerHTML=`<div class="sheet"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-black">${esc(title)}</h2><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="grid gap-3">${body}</div><div class="flex gap-2 mt-5"><button id="saveModal" class="btn flex-1">${label}</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div></div>`; document.querySelector("#modal").classList.remove("hide"); document.querySelector("#saveModal").onclick=()=>{closeModal(); onSave();}}
function closeModal(){document.querySelector("#modal").classList.add("hide")}
function F(label,name,type="text",value="",extra=""){return `<div><label class="label">${label}</label><input class="field" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function S(label,name,opts,value="",allow=""){return `<div><label class="label">${label}</label><select class="field" name="${name}">${allow?`<option value="">${allow}</option>`:""}${opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(value)?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`}
function T(label,name,value=""){return `<div><label class="label">${label}</label><textarea class="field" name="${name}" rows="2">${esc(value)}</textarea></div>`}
function val(form,n){return form.querySelector(`[name="${n}"]`)?.value||""}
function addTeacher(id){
 const x=id ? db.teachers.find(x=>x.id===id) || {} : {};
 const body=`<div class="grid gap-3">${F("Nombre","name","text",x.name)}${F("Correo","email","email",x.email)}${F("Teléfono","phone","tel",x.phone)}${S("Aula habitual","roomId",db.rooms.map(r=>r.name),x.roomId||"","Sin aula")}${F("Horario","horario","text",x.horario)}${T("Observaciones","observaciones",x.observaciones)}${T("Asignaturas relacionadas","asignaturas",(x.asignaturas||[]).join("\n"))}</div>`;
 openModal(id?"Editar profesor":"Nuevo profesor", body, ()=>{
  const f=document.querySelector("#modal");
  const o={id:id||uid("te"),name:val(f,"name"),email:val(f,"email"),phone:val(f,"phone"),roomId:(val(f,"roomId")||""),horario:val(f,"horario"),observaciones:val(f,"observaciones"),asignaturas:(val(f,"asignaturas")||"").split("\n").map(x=>x.trim()).filter(Boolean)};
  if(id){const i=db.teachers.findIndex(x=>x.id===id); if(i>=0) db.teachers[i]={...db.teachers[i],...o};} else {db.teachers.push(o);} save(); render();
 });
}
function addRoom(id){
 const x=id ? db.rooms.find(x=>x.id===id) || {} : {};
 const body=`<div class="grid gap-3">${F("Nombre / número","name","text",x.name)}${F("Edificio","edificio","text",x.edificio)}${F("Planta","planta","text",x.planta)}${T("Observaciones","observaciones",x.observaciones)}</div>`;
 openModal(id?"Editar aula":"Nueva aula", body, ()=>{
  const f=document.querySelector("#modal");
  const o={id:id||uid("room"),name:val(f,"name"),edificio:val(f,"edificio"),planta:val(f,"planta"),observaciones:val(f,"observaciones")};
  if(id){const i=db.rooms.findIndex(x=>x.id===id); if(i>=0) db.rooms[i]={...db.rooms[i],...o};} else {db.rooms.push(o);} save(); render();
 });
}
function addSubject(id){
 const x=id?db.subjects.find(x=>x.id===id)||{}:{};
 const body=`<div class="grid gap-3">${F("Asignatura","name","text",x.name)}${S("Profesor","teacherId",db.teachers.map(t=>t.name),x.teacherId||"","Sin profesor")}${F("Correo de contacto","email","email",x.email)}${S("Aula","roomId",db.rooms.map(r=>r.name),x.roomId||"","Sin aula")}${S("Curso","course",["1º","2º","3º","4º","Máster","Otro"],x.course)}${S("Grupo","group",db.lists.groups.length?db.lists.groups:["A","B","C","D","E"],x.group)}${S("Tipo de asignatura","type",["Teórica","Práctica","Instrumental","Complementaria","Otro"],x.type||"Teórica")}${F("Horario","schedule","text",x.schedule||"")}${F("Créditos","credits","text",x.credits||"")}${F("Color","color","color",x.color||"#a78bfa")}${T("Objetivos","objectives",x.objectives||"")}${T("Material necesario","material",x.material||"")}${T("Notas","notes",x.notes||"")}<div class="grid grid-cols-2 gap-3">${F("Inicio","startDate","date",x.startDate||"")}${F("Fin","endDate","date",x.endDate||"")}</div></div>`;
 openModal(id?"Editar asignatura":"Nueva asignatura", body, ()=>{
  const f=document.querySelector("#modal");
  const teacherId = val(f,"teacherId") || "";
  const teacherName = db.teachers.find(t=>t.id===teacherId)?.name || "";
  const roomId = val(f,"roomId") || "";
  const roomName = db.rooms.find(r=>r.id===roomId)?.name || "";
  const o={id:id||uid("sub"),name:val(f,"name"),teacher:teacherName,teacherId, email:val(f,"email"),room:roomName,roomId,course:val(f,"course"),group:val(f,"group"),type:val(f,"type")||"Teórica",schedule:val(f,"schedule"),credits:val(f,"credits"),color:val(f,"color")||"#a78bfa",objectives:val(f,"objectives"),material:val(f,"material"),startDate:val(f,"startDate"),endDate:val(f,"endDate"),notes:val(f,"notes")};
  if(id){const i=db.subjects.findIndex(x=>x.id===id); if(i>=0) db.subjects[i]={...db.subjects[i],...o};} else {db.subjects.push(o);} save(); render();
 });
}
function del(type,id){if(!confirm("¿Eliminar este elemento?")) return; db[type]=db[type].filter(x=>x.id!==id); save(); render();}
function edit(type,id){({teachers:addTeacher,rooms:addRoom,subjects:addSubject}[type])(id)}
function nav(v){view=v; render();}
function layout(content){return `<div class="safe min-h-screen"><header class="px-4 pt-5 pb-3 sticky top-0 z-20 bg-[#070b16]/90 backdrop-blur"><div class="flex justify-between items-center"><div><div class="text-xs uppercase tracking-[.2em] text-violet-300/80">RitmoAcade</div><div class="text-lg font-black">5.0</div></div><button class="btn secondary" onclick="addEvent()">+ Evento</button></div><div class="grid grid-cols-4 gap-2 mt-4">${navBtn("hoy","🏠","Hoy")}${navBtn("horario","📅","Horario")}${navBtn("estudio","🎼","Estudio")}${navBtn("repertorio","🎵","Repertorio")}</div></header><main class="px-4 pb-6">${content}</main></div>`}
function navBtn(v,i,t){return `<button class="navbtn ${view===v?"active":""}" onclick="nav('${v}')"><span>${i}</span>${t}</button>`}
function sectionHead(title,add,extra=""){return `<div class="flex items-center justify-between mb-3 mt-6"><h2 class="section-title">${title}</h2><div class="flex gap-2">${extra}<button class="btn secondary" onclick="${add}">+</button></div></div>`}
function eventTime(x){return [x.start,x.end].filter(Boolean).join("–")}
function today(){const items=[]; db.subjects.filter(x=>x.day&&x.start&&((new Date(currentDate()+"T12:00:00")).toLocaleDateString("es-ES",{weekday:"long"})===x.day || ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"][new Date(currentDate()+"T12:00:00").getDay()]===x.day)).forEach(x=>items.push({kind:"Clase",title:x.name,start:x.start,end:x.end,place:x.room,sub:x.id,type:"subjects"})); return layout(`<div class="grid gap-3 mt-2"><div class="card p-4"><div class="text-sm muted">Hoy · ${fmtDate(currentDate())}</div><div class="text-2xl font-black mt-1">${items.length?items[0].title:"Día libre de agenda"}</div><div class="small muted mt-1">${items.length?"Agenda actualizada":"Sin actividades programadas"}</div></div>${sectionHead("Asignaturas","addSubject()")}${db.subjects.length?db.subjects.map(x=>`<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(x.name)}</b><div class="small muted">${esc(x.teacher||"Sin profesor")} · ${esc(x.room||"Sin aula")} · ${esc(x.course||"")}</div></div><button class="btn secondary" onclick="edit('subjects','${x.id}')">✎</button></div></div>`).join(""):`<div class="empty">No tienes asignaturas.</div>`}</div>`)}
function horario(){return layout(`<div class="card p-3 mt-2"><div class="text-lg font-black">Horario</div><div class="small muted mt-1">Vista general de la semana</div></div>${sectionHead("Profesores","addTeacher()")}${db.teachers.length?db.teachers.map(t=>`<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(t.name)}</b><div class="small muted">${esc(t.email||"Sin correo")} · ${esc(t.horario||"Sin horario")}</div></div><button class="btn secondary" onclick="edit('teachers','${t.id}')">✎</button></div></div>`).join(""):`<div class="empty">No hay profesores.</div>`}${sectionHead("Aulas","addRoom()")}${db.rooms.length?db.rooms.map(r=>`<div class="card p-3 mb-2"><div class="flex justify-between"><div><b>${esc(r.name)}</b><div class="small muted">${esc(r.edificio||"Sin edificio")} · ${esc(r.planta||"Sin planta")}</div></div><button class="btn secondary" onclick="edit('rooms','${r.id}')">✎</button></div></div>`).join(""):`<div class="empty">No hay aulas.</div>`}`)}
function estudio(){return layout(`<div class="card p-3 mt-2"><div class="text-lg font-black">Estudio</div><div class="small muted mt-1">Registro semanal</div></div><div class="empty">Fase 1: estructura base lista para continuar con las siguientes fases.</div>`)}
function repertorio(){return layout(`<div class="card p-3 mt-2"><div class="text-lg font-black">Repertorio</div><div class="small muted mt-1">Se conserva la lógica actual.</div></div><div class="empty">Esta vista sigue funcionando con la estructura base.</div>`)}
function render(){document.querySelector("#app").innerHTML = view==="hoy"?today():view==="horario"?horario():view==="estudio"?estudio():view==="repertorio"?repertorio():today();}
render();
</script>
</body>
</html>
