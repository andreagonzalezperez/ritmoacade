<style>
:root{--bg:#070b16;--card:#101827;--card2:#172236;--line:#29384f;--text:#f1f5ff;--muted:#93a4bd;--accent:#a78bfa;--blue:#60a5fa;--red:#f87171;--green:#4ade80;--yellow:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.shell{max-width:920px;margin:auto;padding:0 14px 94px}.top{position:sticky;top:0;z-index:20;background:rgba(7,11,22,.94);backdrop-filter:blur(15px);padding:13px 0 11px;border-bottom:1px solid rgba(41,56,79,.65)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c4b5fd}.title{font-size:22px;font-weight:900;margin-top:2px}.sub{font-size:12px;color:var(--muted)}.content{padding-top:12px}.card{background:rgba(16,24,39,.92);border:1px solid var(--line);border-radius:16px;padding:14px}.list{display:grid;gap:9px}.section{margin-top:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:17px 0 9px}.sectiontitle{font-size:18px;font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:7px}.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:750}.btn.primary{background:var(--accent);border-color:var(--accent);color:#120d20}.btn.danger{color:#fecaca;background:#35171c}.btn.small{font-size:12px;padding:7px 9px}.grid{display:grid;gap:10px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.field{width:100%;border:1px solid #30415d;background:#0c1423;color:var(--text);border-radius:10px;padding:10px 11px;outline:none}.field:focus{border-color:var(--accent)}.label{display:block;color:#aab8ce;font-size:12px;margin-bottom:5px}.area{min-height:78px;resize:vertical}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:#111b2c;border-radius:999px;padding:4px 8px;font-size:11px;color:#dbe5f7}.danger{color:var(--red)}.ok{color:var(--green)}.warn{color:var(--yellow)}.empty{padding:18px;text-align:center;border:1px dashed #34445e;border-radius:14px;color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid var(--line);background:#111a2a;border-radius:14px;padding:12px}.statnum{font-size:22px;font-weight:900}.progress{height:8px;background:#202d42;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.filters .btn{white-space:nowrap}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:10px}.day{min-height:82px;border:1px solid var(--line);border-radius:10px;background:#0d1626;padding:5px}.day.today{border-color:var(--accent)}.daynum{font-size:11px;font-weight:850}.dot{font-size:9px;background:#18274a;border-radius:5px;padding:3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(12,18,31,.97);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0005}.navinner{max-width:920px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.navbtn{border:0;background:transparent;color:#8191a9;border-radius:11px;padding:5px 2px;font-size:9px;font-weight:750}.navbtn span{display:block;font-size:18px;line-height:20px;margin-bottom:2px}.navbtn.active{color:#ddd1ff;background:rgba(167,139,250,.13)}.modal{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0b1220;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 15px calc(24px + env(safe-area-inset-bottom));margin:auto auto 0}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.modaltitle{font-size:20px;font-weight:900}.toast{position:fixed;z-index:80;left:50%;bottom:92px;transform:translateX(-50%);background:#eef2ff;color:#111827;padding:10px 14px;border-radius:12px;font-weight:800}.toast.hidden{display:none}.hide{display:none!important}.tag{display:inline-block;font-size:10px;border:1px solid #4a3d6e;background:#1c1732;color:#ddd1ff;border-radius:6px;padding:3px 6px}.dangerbox{border-color:#6f2a33;background:#291419}.click{cursor:pointer}@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}.title{font-size:20px}.navbtn span{font-size:17px}}
</style>

<body>
<div id="app"></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const KEY='ritmoacade_pro_v5';const LEGACY=['ritmoacade_pro_v4','ritmoacade_pro_v3'];
const DEFAULTS={schemaVersion:5,profile:{name:'',career:'',institution:'',weeklyGoal:420},lists:{teachers:[],rooms:[],groups:[],instruments:['Saxofón','Piano','Lenguaje Musical','Armonía'],studyTypes:['Técnica','Repertorio','Lectura','Teoría','Preparación de clase','Repaso'],examTypes:['Parcial','Final','Recuperación','Prueba de acceso','Audición','TFM'],eventTypes:['Clase','Audición','Concierto','Entrega','Reunión','Otro'],tags:['Conservatorio','Universidad','Trabajo','Personal'],priorities:['Alta','Media','Baja']},teachers:[],rooms:[],subjects:[],study:[],repertoire:[],tasks:[],exams:[],rehearsals:[],events:[],weekly:[],settings:{theme:'dark'}};
let db,view=location.hash.slice(1)||'hoy',calDate=new Date(),taskFilters={status:'',priority:'',subject:'',tag:''},toastTimer;
function clone(x){return typeof structuredClone==='function'?structuredClone(x):JSON.parse(JSON.stringify(x))}function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function localDate(d=new Date()){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}function dateObj(s){return s?new Date(s+'T12:00:00'):null}function daysFromToday(s){return s?Math.round((dateObj(s)-dateObj(localDate()))/86400000):null}function fmtDate(s){return s?dateObj(s).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}function dayName(s){return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][dateObj(s).getDay()]}
function merge(a,b){const o=clone(a);for(const k of Object.keys(b||{})){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&o[k])o[k]=merge(o[k],b[k]);else o[k]=b[k]}return o}
function normalize(){db=merge(DEFAULTS,db||{});db.schemaVersion=5;db.teachers=(db.teachers||[]).map(x=>({...x,id:x.id||uid('te')}));db.rooms=(db.rooms||[]).map(x=>({...x,id:x.id||uid('room')}));db.subjects=(db.subjects||[]).map(x=>({...x,id:x.id||uid('sub'),teacherId:x.teacherId||'',roomId:x.roomId||'',name:x.name||''}));db.tasks=(db.tasks||[]).map(x=>({...x,id:x.id||uid('task'),title:x.title||'',description:x.description||'',subjectId:x.subjectId||'',subject:x.subject||'',dueDate:x.dueDate||x.due||'',priority:x.priority||'Media',status:x.status||'Pendiente',tags:Array.isArray(x.tags)?x.tags:[],timeEstimated:+x.timeEstimated||0,timeSpent:+x.timeSpent||0,notes:x.notes||''}));db.exams=(db.exams||[]).map(x=>({...x,id:x.id||uid('exam'),subjectId:x.subjectId||'',subject:x.subject||'',type:x.type||'',convocation:x.convocation||x.call||'',date:x.date||'',time:x.time||'',roomId:x.roomId||'',room:x.room||'',teacherId:x.teacherId||'',teacher:x.teacher||'',syllabus:x.syllabus||'',notes:x.notes||'',preparationStatus:x.preparationStatus||x.prep||'No iniciada'}));db.repertoire=(db.repertoire||[]).map(x=>({...x,id:x.id||uid('rep'),composer:x.composer||'',work:x.work||'',instrument:x.instrument||'',subjectId:x.subjectId||'',subject:x.subject||'',course:x.course||'',difficulty:x.difficulty||'',duration:x.duration||'',state:x.state||'Por empezar',startDate:x.startDate||'',targetDate:x.targetDate||'',lastStudy:x.lastStudy||'',minutesAccumulated:+x.minutesAccumulated||0,technical:x.technical||x.objectivesTechnical||'',interpretive:x.interpretive||x.objectivesInterpretive||'',notes:x.notes||'',progress:+x.progress||0}));db.study=(db.study||[]).map(x=>({...x,id:x.id||uid('stu'),date:x.date||localDate(),duration:+x.duration||0,type:x.type||'Estudio',instrument:x.instrument||'',repertoireId:x.repertoireId||'',objective:x.objective||'',notes:x.notes||''}));db.events=db.events||[];db.rehearsals=db.rehearsals||[];db.weekly=db.weekly||[]}
function migrate(raw){const source=raw&&typeof raw==='object'?raw:{};db=merge(DEFAULTS,source);normalize();return db}
function load(){try{const v5=JSON.parse(localStorage.getItem(KEY)||'null');if(v5){return migrate(v5)}for(const k of LEGACY){const old=JSON.parse(localStorage.getItem(k)||'null');if(old){const x=migrate(old);localStorage.setItem(KEY,JSON.stringify(x));return x}}}catch(e){console.error(e)}return clone(DEFAULTS)}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),1800)}
function subject(id){return db.subjects.find(x=>x.id===id)}function teacher(id){return db.teachers.find(x=>x.id===id)}function room(id){return db.rooms.find(x=>x.id===id)}
function nav(v){view=v;location.hash=v;render()}function navBtn(v,icon,label){return `<button class="navbtn ${view===v?'active':''}" onclick="nav('${v}')"><span>${icon}</span>${label}</button>`}
function layout(title,content){return `<div class="shell"><header class="top"><div class="toprow"><div><div class="brand">RitmoAcade</div><div class="title">${esc(title)}</div></div><div class="actions"><button class="btn small" onclick="openSearch()">⌕ Buscar</button><button class="btn small" onclick="settingsForm()">⚙</button></div></div></header><main class="content">${content}</main></div><nav class="nav"><div class="navinner">${navBtn('hoy','⌂','Hoy')}${navBtn('horario','▦','Horario')}${navBtn('estudio','◉','Estudio')}${navBtn('repertorio','♫','Repertorio')}${navBtn('tareas','✓','Tareas')}${navBtn('mas','☰','Más')}</div></nav>`}
function section(title,action,label='+ Añadir'){return `<div class="sectionhead"><div class="sectiontitle">${title}</div>${action?`<button class="btn primary small" onclick="${action}">${label}</button>`:''}</div>`}
function F(label,name,type='text',value='',extra=''){return `<label><span class="label">${label}</span><input class="field" name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}function T(label,name,value=''){return `<label><span class="label">${label}</span><textarea class="field area" name="${name}">${esc(value)}</textarea></label>`}function S(label,name,opts,value='',blank=''){return `<label><span class="label">${label}</span><select class="field" name="${name}">${blank?`<option value="">${esc(blank)}</option>`:''}${opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}function val(root,n){return root.querySelector(`[name="${n}"]`)?.value||''}
function openModal(title,body,onSave){const m=document.getElementById('modal');m.innerHTML=`<div class="sheet"><div class="modalhead"><div class="modaltitle">${esc(title)}</div><button class="btn small" onclick="closeModal()">✕</button></div><div id="modalBody" class="grid">${body}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveModal">Guardar</button></div></div>`;m.classList.remove('hidden');document.getElementById('saveModal').onclick=onSave}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function upsert(arr,obj){const i=arr.findIndex(x=>x.id===obj.id);if(i<0)arr.push(obj);else arr[i]=obj}function del(type,id){if(!confirm('¿Eliminar este elemento?'))return;db[type]=db[type].filter(x=>x.id!==id);save();render();toast('Eliminado')}
function teacherForm(id){const x=id?teacher(id)||{}:{};openModal(id?'Editar profesor':'Nuevo profesor',`${F('Nombre','name','text',x.name)}${F('Correo','email','email',x.email)}${F('Teléfono','phone','tel',x.phone)}${S('Aula habitual','room',db.rooms.map(r=>r.name),room(x.roomId)?.name||x.room,'Sin aula')}${F('Horario','horario','text',x.horario)}${T('Observaciones','observaciones',x.observaciones)}`,()=>{const f=document.getElementById('modalBody'),rn=val(f,'room'),r=db.rooms.find(z=>z.name===rn);upsert(db.teachers,{...x,id:id||uid('te'),name:val(f,'name'),email:val(f,'email'),phone:val(f,'phone'),roomId:r?.id||'',horario:val(f,'horario'),observaciones:val(f,'observaciones')});save();closeModal();render()})}
function roomForm(id){const x=id?room(id)||{}:{};openModal(id?'Editar aula':'Nueva aula',`${F('Nombre / número','name','text',x.name)}${F('Edificio','edificio','text',x.edificio)}${F('Planta','planta','text',x.planta)}${T('Observaciones','observaciones',x.observaciones)}`,()=>{const f=document.getElementById('modalBody');upsert(db.rooms,{...x,id:id||uid('room'),name:val(f,'name'),edificio:val(f,'edificio'),planta:val(f,'planta'),observaciones:val(f,'observaciones')});save();closeModal();render()})}
function subjectForm(id){const x=id?subject(id)||{}:{};openModal(id?'Editar asignatura':'Nueva asignatura',`${F('Asignatura','name','text',x.name)}${S('Profesor','teacher',db.teachers.map(t=>t.name),teacher(x.teacherId)?.name||x.teacher,'Sin profesor')}${F('Correo de contacto','email','email',x.email)}${S('Aula','room',db.rooms.map(r=>r.name),room(x.roomId)?.name||x.room,'Sin aula')}${S('Curso','course',['1º','2º','3º','4º','Máster','Otro'],x.course)}${S('Grupo','group',['A','B','C','D','E'],x.group,'Sin grupo')}${F('Horario','schedule','text',x.schedule||'')}${F('Créditos','credits','number',x.credits||'','min="0" step="0.5"')}${F('Color','color','color',x.color||'#a78bfa')}${T('Objetivos','objectives',x.objectives)}${T('Material necesario','material',x.material)}<div class="grid grid2">${F('Fecha inicio','startDate','date',x.startDate)}${F('Fecha fin','endDate','date',x.endDate)}</div>${T('Notas','notes',x.notes)}`,()=>{const f=document.getElementById('modalBody'),tn=val(f,'teacher'),rn=val(f,'room'),t=db.teachers.find(z=>z.name===tn),r=db.rooms.find(z=>z.name===rn);upsert(db.subjects,{...x,id:id||uid('sub'),name:val(f,'name'),teacher:t?.name||tn,teacherId:t?.id||'',email:val(f,'email'),room:r?.name||rn,roomId:r?.id||'',course:val(f,'course'),group:val(f,'group'),schedule:val(f,'schedule'),credits:val(f,'credits'),color:val(f,'color'),objectives:val(f,'objectives'),material:val(f,'material'),startDate:val(f,'startDate'),endDate:val(f,'endDate'),notes:val(f,'notes')});save();closeModal();render()})}
function taskForm(id){const x=id?db.tasks.find(t=>t.id===id)||{}:{};openModal(id?'Editar tarea':'Nueva tarea',`${F('Título','title','text',x.title)}${T('Descripción','description',x.description)}${S('Asignatura','subject',db.subjects.map(s=>s.name),x.subject,'Sin asignatura')}${F('Fecha de entrega','dueDate','date',x.dueDate)}${S('Prioridad','priority',['Alta','Media','Baja'],x.priority||'Media')}${S('Estado','status',['Pendiente','En progreso','Completada','Cancelada'],x.status||'Pendiente')}${T('Etiquetas (una por línea)','tags',(x.tags||[]).join('\n'))}<div class="grid grid2">${F('Tiempo estimado (min)','timeEstimated','number',x.timeEstimated||0,'min="0"')}${F('Tiempo realizado (min)','timeSpent','number',x.timeSpent||0,'min="0"')}</div>${T('Notas','notes',x.notes)}`,()=>{const f=document.getElementById('modalBody'),sn=val(f,'subject'),s=db.subjects.find(z=>z.name===sn);upsert(db.tasks,{...x,id:id||uid('task'),title:val(f,'title'),description:val(f,'description'),subject:s?.name||sn,subjectId:s?.id||'',dueDate:val(f,'dueDate'),priority:val(f,'priority'),status:val(f,'status'),tags:val(f,'tags').split('\n').map(z=>z.trim()).filter(Boolean),timeEstimated:+val(f,'timeEstimated')||0,timeSpent:+val(f,'timeSpent')||0,notes:val(f,'notes')});save();closeModal();render()})}
function examForm(id){const x=id?db.exams.find(e=>e.id===id)||{}:{};openModal(id?'Editar examen':'Nuevo examen',`${S('Asignatura','subject',db.subjects.map(s=>s.name),x.subject,'Sin asignatura')}${S('Tipo','type',db.lists.examTypes,x.type,'Tipo')}${F('Convocatoria','convocation','text',x.convocation)}<div class="grid grid2">${F('Fecha','date','date',x.date)}${F('Hora','time','time',x.time)}</div>${S('Aula','room',db.rooms.map(r=>r.name),x.room,'Sin aula')}${S('Profesor','teacher',db.teachers.map(t=>t.name),x.teacher,'Sin profesor')}${T('Temario','syllabus',x.syllabus)}${T('Notas','notes',x.notes)}${S('Estado de preparación','preparationStatus',['No iniciada','En progreso','Bien preparada','Repaso final','Realizada'],x.preparationStatus||'No iniciada')}`,()=>{const f=document.getElementById('modalBody'),sn=val(f,'subject'),tn=val(f,'teacher'),rn=val(f,'room'),s=db.subjects.find(z=>z.name===sn),t=db.teachers.find(z=>z.name===tn),r=db.rooms.find(z=>z.name===rn);upsert(db.exams,{...x,id:id||uid('exam'),subject:s?.name||sn,subjectId:s?.id||'',type:val(f,'type'),convocation:val(f,'convocation'),date:val(f,'date'),time:val(f,'time'),room:r?.name||rn,roomId:r?.id||'',teacher:t?.name||tn,teacherId:t?.id||'',syllabus:val(f,'syllabus'),notes:val(f,'notes'),preparationStatus:val(f,'preparationStatus')});save();closeModal();render()})}
function repForm(id){const x=id?db.repertoire.find(r=>r.id===id)||{}:{};openModal(id?'Editar obra':'Nueva obra',`${F('Compositor','composer','text',x.composer)}${F('Obra','work','text',x.work)}${S('Instrumento','instrument',db.lists.instruments,x.instrument,'Sin instrumento')}${S('Asignatura','subject',db.subjects.map(s=>s.name),x.subject,'Sin asignatura')}${S('Curso','course',['1º','2º','3º','4º','Máster','Otro'],x.course)}${S('Dificultad','difficulty',['Inicial','Media','Alta','Muy alta'],x.difficulty)}${F('Duración (min)','duration','number',x.duration||0,'min="0"')}${S('Estado','state',['Por empezar','En estudio','Montada','En perfeccionamiento','Memorizada','Lista'],x.state||'Por empezar')}${F('Fecha inicio','startDate','date',x.startDate)}${F('Fecha objetivo','targetDate','date',x.targetDate)}${F('Progreso (%)','progress','number',x.progress||0,'min="0" max="100"')}${T('Objetivos técnicos','technical',x.technical)}${T('Objetivos interpretativos','interpretive',x.interpretive)}${T('Notas','notes',x.notes)}`,()=>{const f=document.getElementById('modalBody'),sn=val(f,'subject'),s=db.subjects.find(z=>z.name===sn);upsert(db.repertoire,{...x,id:id||uid('rep'),composer:val(f,'composer'),work:val(f,'work'),instrument:val(f,'instrument'),subject:s?.name||sn,subjectId:s?.id||'',course:val(f,'course'),difficulty:val(f,'difficulty'),duration:+val(f,'duration')||0,state:val(f,'state'),startDate:val(f,'startDate'),targetDate:val(f,'targetDate'),progress:Math.max(0,Math.min(100,+val(f,'progress')||0)),technical:val(f,'technical'),interpretive:val(f,'interpretive'),notes:val(f,'notes'),minutesAccumulated:+x.minutesAccumulated||0,lastStudy:x.lastStudy||''});save();closeModal();render()})}
function studyForm(id){const x=id?db.study.find(s=>s.id===id)||{}:{date:localDate(),duration:30,type:'Repertorio'};const repOptions=db.repertoire.map(r=>`${r.composer} — ${r.work}`);openModal(id?'Editar sesión':'Registrar estudio',`${F('Fecha','date','date',x.date)}${F('Duración (min)','duration','number',x.duration||30,'min="1"')}${S('Tipo','type',db.lists.studyTypes,x.type)}${S('Obra de repertorio','rep',repOptions,db.repertoire.find(r=>r.id===x.repertoireId)?`${db.repertoire.find(r=>r.id===x.repertoireId).composer} — ${db.repertoire.find(r=>r.id===x.repertoireId).work}`:'','Sin obra')}${S('Instrumento','instrument',db.lists.instruments,x.instrument,'Sin especificar')}${F('Objetivo','objective','text',x.objective)}${T('Notas','notes',x.notes)}`,()=>{const f=document.getElementById('modalBody'),rp=val(f,'rep'),r=db.repertoire.find(z=>`${z.composer} — ${z.work}`===rp),old=id?db.study.find(s=>s.id===id):null,o={...x,id:id||uid('stu'),date:val(f,'date'),duration:+val(f,'duration')||0,type:val(f,'type'),repertoireId:r?.id||'',instrument:val(f,'instrument'),objective:val(f,'objective'),notes:val(f,'notes')};upsert(db.study,o);if(r){r.minutesAccumulated=Math.max(0,(+r.minutesAccumulated||0)+(o.duration-(old?.duration||0)));r.lastStudy=o.date}save();closeModal();render()})}
function eventForm(id,type='event'){const arr=db[type==='rehearsal'?'rehearsals':'events'],x=id?arr.find(e=>e.id===id)||{}:{date:localDate()};const body=type==='rehearsal'?`${F('Fecha','date','date',x.date)}<div class="grid grid2">${F('Inicio','start','time',x.start)}${F('Fin','end','time',x.end)}</div>${F('Grupo','group','text',x.group)}${F('Repertorio','repertoire','text',x.repertoire)}${S('Lugar','place',db.rooms.map(r=>r.name),x.place,'Sin lugar')}${T('Notas','notes',x.notes)}`:`${S('Tipo','type',db.lists.eventTypes,x.type)}${F('Título','title','text',x.title)}${F('Fecha','date','date',x.date)}<div class="grid grid2">${F('Inicio','start','time',x.start)}${F('Fin','end','time',x.end)}</div>${S('Lugar','place',db.rooms.map(r=>r.name),x.place,'Sin lugar')}${T('Notas','notes',x.notes)}`;openModal(id?'Editar actividad':'Nueva actividad',body,()=>{const f=document.getElementById('modalBody'),o={...x,id:id||uid(type==='rehearsal'?'reh':'evt')};['date','start','end','group','repertoire','place','notes','type','title'].forEach(k=>{if(f.querySelector(`[name="${k}"]`))o[k]=val(f,k)});upsert(arr,o);save();closeModal();render()})}
function isOverdue(t){return t.dueDate&&daysFromToday(t.dueDate)<0&&t.status!=='Completada'&&t.status!=='Cancelada'}function taskSort(a,b){const oa=isOverdue(a),ob=isOverdue(b);if(oa!==ob)return oa?-1:1;const p={Alta:0,Media:1,Baja:2};return(p[a.priority]??3)-(p[b.priority]??3)||String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))}
function filteredTasks(){return db.tasks.filter(t=>(!taskFilters.status||t.status===taskFilters.status)&&(!taskFilters.priority||t.priority===taskFilters.priority)&&(!taskFilters.subject||t.subjectId===taskFilters.subject)&&(!taskFilters.tag||(t.tags||[]).includes(taskFilters.tag))).sort(taskSort)}
function taskCard(t){return `<div class="card"><div class="row"><div style="min-width:0"><b>${esc(t.title||'Sin título')}</b><div class="sub">${esc(t.subject||'Sin asignatura')} · ${t.dueDate?fmtDate(t.dueDate):'Sin fecha'}</div></div><div class="actions"><button class="btn small" onclick="taskForm('${t.id}')">Editar</button><button class="btn small danger" onclick="del('tasks','${t.id}')">×</button></div></div><div class="actions" style="margin-top:8px">${t.priority?`<span class="pill ${t.priority==='Alta'?'danger':t.priority==='Baja'?'ok':'warn'}">${esc(t.priority)}</span>`:''}<span class="pill">${esc(t.status)}</span>${isOverdue(t)?'<span class="pill danger">Atrasada</span>':''}${t.timeEstimated?`<span class="pill">⏱ ${t.timeEstimated} min</span>`:''}${(t.tags||[]).map(z=>`<span class="tag">#${esc(z)}</span>`).join('')}</div></div>`}
function examCard(e){const d=daysFromToday(e.date);return `<div class="card"><div class="row"><div><b>${esc(e.subject||'Examen')}</b><div class="sub">${esc(e.type||'')} · ${esc(e.convocation||'')} · ${fmtDate(e.date)} ${e.time?'· '+esc(e.time):''}</div><div class="sub">${esc(e.teacher||'Sin profesor')} · ${esc(e.room||'Sin aula')}</div></div><div class="actions"><button class="btn small" onclick="examForm('${e.id}')">Editar</button><button class="btn small danger" onclick="del('exams','${e.id}')">×</button></div></div><div class="actions" style="margin-top:8px"><span class="pill">${esc(e.preparationStatus||'No iniciada')}</span>${d!=null&&d>=0?`<span class="pill">${d===0?'Hoy':d===1?'Mañana':d+' días'}</span>`:''}</div></div>`}
function repertoireCard(r){return `<div class="card"><div class="row"><div><b>${esc(r.composer)}${r.composer&&r.work?' — ':''}${esc(r.work)}</b><div class="sub">${esc(r.instrument||'')} · ${esc(r.state||'')} · ${r.minutesAccumulated||0} min</div></div><div class="actions"><button class="btn small" onclick="repForm('${r.id}')">Editar</button><button class="btn small danger" onclick="del('repertoire','${r.id}')">×</button></div></div><div class="progress" style="margin-top:9px"><i style="width:${Math.max(0,Math.min(100,+r.progress||0))}%"></i></div><div class="sub" style="margin-top:4px">${+r.progress||0}%${r.lastStudy?' · Último estudio '+fmtDate(r.lastStudy):''}</div></div>`}
function hoy(){const d=localDate(),classes=db.subjects.filter(s=>s.day===dayName(d)).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99')),tasks=filteredTasks().filter(t=>t.status!=='Completada'&&t.status!=='Cancelada').slice(0,5),exams=db.exams.filter(e=>e.date&&daysFromToday(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3),mins=db.study.filter(s=>s.date>=weekStart()&&s.date<=weekEnd()).reduce((n,s)=>n+(+s.duration||0),0);return layout('Hoy',`<div class="card"><div class="sub">${fmtDate(d)}</div><div style="font-size:24px;font-weight:900;margin-top:3px">${classes[0]?esc(classes[0].name):'Organiza tu día'}</div><div class="sub">${classes[0]?[classes[0].start,classes[0].end].filter(Boolean).join('–'):'Sin clase configurada para hoy'}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="studyForm()">▶ Registrar estudio</button><button class="btn" onclick="taskForm()">+ Tarea</button></div></div><div class="statgrid section"><div class="stat"><div class="statnum">${tasks.length}</div><div class="sub">tareas pendientes</div></div><div class="stat"><div class="statnum">${mins}</div><div class="sub">min esta semana</div></div><div class="stat"><div class="statnum">${exams.length}</div><div class="sub">exámenes próximos</div></div></div>${section('Tareas pendientes','taskForm()')}<div class="list">${tasks.length?tasks.map(taskCard).join(''):'<div class="empty">No tienes tareas pendientes.</div>'}</div>${section('Próximos exámenes','examForm()')}<div class="list">${exams.length?exams.map(examCard).join(''):'<div class="empty">No hay exámenes próximos.</div>'}</div>`)}
function weekStart(){const d=dateObj(localDate()),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return localDate(d)}function weekEnd(){const d=dateObj(weekStart());d.setDate(d.getDate()+6);return localDate(d)}
function horario(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let n=1;n<=days;n++){const s=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,items=calendarItems(s);cells+=`<div class="day ${s===localDate()?'today':''}" onclick="dayDetail('${s}')"><div class="daynum">${n}</div>${items.slice(0,3).map(x=>`<div class="dot">${esc(x.start?x.start+' ':'')}${esc(x.title)}</div>`).join('')}</div>`}return layout('Horario',`<div class="row"><button class="btn" onclick="changeMonth(-1)">‹</button><b>${calDate.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b><button class="btn" onclick="changeMonth(1)">›</button></div><div class="calendar" style="margin-top:10px">${['L','M','X','J','V','S','D'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div>${section('Asignaturas','subjectForm()')}<div class="list">${db.subjects.length?db.subjects.map(s=>`<div class="card"><div class="row"><div><b>${esc(s.name)}</b><div class="sub">${esc(s.teacher||'Sin profesor')} · ${esc(s.room||'Sin aula')} · ${esc(s.schedule||s.day||'Sin horario')}</div></div><div class="actions"><button class="btn small" onclick="subjectForm('${s.id}')">Editar</button><button class="btn small danger" onclick="del('subjects','${s.id}')">×</button></div></div></div>`).join(''):'<div class="empty">Añade tu primera asignatura.</div>'}</div>${section('Profesores','teacherForm()')}<div class="list">${db.teachers.length?db.teachers.map(t=>`<div class="card"><div class="row"><div><b>${esc(t.name)}</b><div class="sub">${esc(t.email||'Sin correo')} · ${esc(t.horario||'Sin horario')}</div></div><button class="btn small" onclick="teacherForm('${t.id}')">Editar</button></div></div>`).join(''):'<div class="empty">No hay profesores.</div>'}</div>${section('Aulas','roomForm()')}<div class="list">${db.rooms.length?db.rooms.map(r=>`<div class="card"><div class="row"><div><b>${esc(r.name)}</b><div class="sub">${esc(r.edificio||'')} ${esc(r.planta||'')}</div></div><button class="btn small" onclick="roomForm('${r.id}')">Editar</button></div></div>`).join(''):'<div class="empty">No hay aulas.</div>'}</div>`)}
function calendarItems(s){const a=[];db.events.filter(e=>e.date===s).forEach(e=>a.push({title:e.title||e.type||'Evento',start:e.start}));db.rehearsals.filter(e=>e.date===s).forEach(e=>a.push({title:'Ensayo · '+(e.repertoire||''),start:e.start}));db.study.filter(e=>e.date===s).forEach(e=>a.push({title:'Estudio · '+e.duration+' min',start:e.start}));return a}function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);render()}function dayDetail(s){const its=calendarItems(s);openModal('Agenda · '+fmtDate(s),its.length?its.map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="sub">${esc(x.start||'')}</div></div>`).join(''):'<div class="empty">No hay actividades.</div>',()=>closeModal());document.getElementById('saveModal').style.display='none'}
function estudio(){const week=db.study.filter(s=>s.date>=weekStart()&&s.date<=weekEnd()).reduce((n,s)=>n+(+s.duration||0),0),total=db.study.reduce((n,s)=>n+(+s.duration||0),0);return layout('Estudio',`${section('Registro de estudio','studyForm()')}<div class="statgrid"><div class="stat"><div class="statnum">${week}</div><div class="sub">min esta semana</div></div><div class="stat"><div class="statnum">${total}</div><div class="sub">min acumulados</div></div><div class="stat"><div class="statnum">${db.study.length}</div><div class="sub">sesiones</div></div></div><div class="list section">${db.study.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(s=>`<div class="card"><div class="row"><div><b>${fmtDate(s.date)} · ${s.duration} min</b><div class="sub">${esc(s.type)} ${s.instrument?'· '+esc(s.instrument):''}</div>${s.repertoireId?`<div class="sub">${esc(db.repertoire.find(r=>r.id===s.repertoireId)?.work||'')}</div>`:''}</div><button class="btn small" onclick="studyForm('${s.id}')">Editar</button></div></div>`).join('')||'<div class="empty">Todavía no hay sesiones.</div>'}</div>`)}
function repertorio(){return layout('Repertorio',`${section('Obras','repForm()')}<div class="list">${db.repertoire.length?db.repertoire.map(repertoireCard).join(''):'<div class="empty">Añade obras para controlar progreso y tiempo de estudio.</div>'}</div>`)}
function tareas(){const arr=filteredTasks(),late=arr.filter(isOverdue).length,subjects=[...new Map(db.subjects.map(s=>[s.id,s])).values()],tags=[...new Set(db.tasks.flatMap(t=>t.tags||[]))];return layout('Tareas',`${late?`<div class="card dangerbox danger"><b>⚠ ${late} tarea(s) atrasada(s)</b></div>`:''}${section('Mis tareas','taskForm')}<div class="filters"><button class="btn small" onclick="toggleFilter('status','')">Todas</button>${['Pendiente','En progreso','Completada'].map(x=>`<button class="btn small" onclick="toggleFilter('status','${x}')">${x}</button>`).join('')}${['Alta','Media','Baja'].map(x=>`<button class="btn small" onclick="toggleFilter('priority','${x}')">${x}</button>`).join('')}</div>${subjects.length?`<div class="filters">${subjects.map(s=>`<button class="btn small" onclick="toggleFilter('subject','${s.id}')">${esc(s.name)}</button>`).join('')}</div>`:''}${tags.length?`<div class="filters">${tags.map(t=>`<button class="btn small" onclick="toggleFilter('tag','${esc(t)}')">#${esc(t)}</button>`).join('')}</div>`:''}<div class="list">${arr.length?arr.map(taskCard).join(''):'<div class="empty">No hay tareas con estos filtros.</div>'}</div>`)}function toggleFilter(k,v){taskFilters[k]=taskFilters[k]===v?'':v;render()}
function exams(){return layout('Exámenes',`${section('Exámenes','examForm')}<div class="list">${db.exams.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(examCard).join('')||'<div class="empty">No hay exámenes.</div>'}</div>`)}
function mas(){return layout('Más',`${section('Exámenes','examForm')}<div class="list">${db.exams.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(examCard).join('')||'<div class="empty">No hay exámenes.</div>'}</div>${section('Ensayos',"eventForm(null,'rehearsal')")}<div class="list">${db.rehearsals.map(r=>`<div class="card"><b>Ensayo${r.group?' · '+esc(r.group):''}</b><div class="sub">${fmtDate(r.date)} · ${esc(r.start||'')} ${r.repertoire?'· '+esc(r.repertoire):''}</div></div>`).join('')||'<div class="empty">No hay ensayos.</div>'}</div>${section('Eventos','eventForm()')}<div class="list">${db.events.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,20).map(e=>`<div class="card"><b>${esc(e.title||e.type||'Evento')}</b><div class="sub">${fmtDate(e.date)} · ${esc(e.start||'')}</div></div>`).join('')||'<div class="empty">No hay eventos.</div>'}</div><div class="card section"><b>Copias de seguridad</b><div class="sub" style="margin:5px 0 10px">Tus datos permanecen en este dispositivo mediante localStorage.</div><div class="actions"><button class="btn" onclick="exportData()">Exportar JSON</button><label class="btn">Importar JSON<input id="importFile" class="hide" type="file" accept=".json" onchange="importData(event)"></label></div></div>`)}
function settingsForm(){openModal('Perfil',`${F('Nombre','name','text',db.profile.name)}${F('Carrera / estudios','career','text',db.profile.career)}${F('Centro','institution','text',db.profile.institution)}${F('Objetivo semanal de estudio (min)','weeklyGoal','number',db.profile.weeklyGoal||420,'min="0"')}`,()=>{const f=document.getElementById('modalBody');db.profile={name:val(f,'name'),career:val(f,'career'),institution:val(f,'institution'),weeklyGoal:+val(f,'weeklyGoal')||0};save();closeModal();render()})}
function openSearch(){openModal('Buscar',`${F('Texto','q') }<div id="results" class="list"></div>`,()=>closeModal());const q=document.querySelector('[name=q]');q.oninput=()=>{const term=q.value.toLowerCase().trim(),box=document.getElementById('results');if(!term){box.innerHTML='';return}const groups=[['Asignaturas',db.subjects],['Tareas',db.tasks],['Exámenes',db.exams],['Obras',db.repertoire],['Profesores',db.teachers]];let out=[];groups.forEach(([g,a])=>a.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(term))out.push(`<div class="card"><b>${g}</b><div class="sub">${esc(x.name||x.title||x.work||x.subject||'')}</div></div>`)}));box.innerHTML=out.slice(0,25).join('')||'<div class="empty">Sin resultados.</div>'};q.focus()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ritmoacade-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);normalize();save();render();toast('Importación completada')}catch(err){alert('El archivo no es un backup válido.')}};r.readAsText(f)}
function render(){normalize();const map={hoy:hoy,horario:horario,estudio:estudio,repertorio:repertorio,tareas:tareas,mas:mas};if(!map[view])view='hoy';document.getElementById('app').innerHTML=map[view]()}window.addEventListener('hashchange',()=>{view=location.hash.slice(1)||'hoy';render()});
db=load();render();
</script>
